<style>
  /* Açılış ekranı — uygulama kendi stillerini yüklemeden önce görünür */
  html, body { margin:0; padding:0; background:#F1F6F7;
    font-family:'Montserrat', system-ui, -apple-system, sans-serif; }
  #acilis { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:24px;
    background:#F1F6F7; z-index:9999; }
  #acilis img { width:76px; height:76px; border-radius:22px;
    box-shadow:0 8px 28px rgba(18,48,58,.14); }
  #acilis .ad { font-size:17px; font-weight:900; color:#12303A;
    letter-spacing:-.3px; }
  #acilis .alt { font-size:12px; font-weight:600; color:#6C8A93;
    text-align:center; line-height:1.6; max-width:280px; }
  #acilis .cubuk { width:168px; height:5px; border-radius:99px;
    background:#DCE9EC; overflow:hidden; }
  #acilis .cubuk i { display:block; height:100%; width:40%; border-radius:99px;
    background:linear-gradient(90deg,#06788C,#20A5BC); animation:kay 1.1s infinite; }
  @keyframes kay { 0%{transform:translateX(-110%)} 100%{transform:translateX(320%)} }
  #acilis.hata .cubuk { display:none; }
  #acilis .yenile { margin-top:4px; background:#06788C; color:#fff; border:none;
    border-radius:99px; padding:11px 22px; font-family:inherit; font-weight:800;
    font-size:13px; cursor:pointer; display:none; }
  #acilis.hata .yenile { display:block; }
</style>

/* Rengi koyulaştırır — açık dolgu üzerinde yazı okunaklı kalsın diye */
const koyult = (hex, k = 0.42) => {
    const h = String(hex).replace("#", "");
    const p = (i) => Math.round(parseInt(h.slice(i, i + 2), 16) * (1 - k));
    return `rgb(${p(0)}, ${p(2)}, ${p(4)})`;
};
/* Hex rengi saydam tona çevirir — yazdırmada color-mix'e güvenmemek için */
const ton = (hex, a) => {
    const h = String(hex).replace("#", "");
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${a})`;
};

.ust-ad{font-weight:800;font-size:16px;letter-spacing:-.3px;color:var(--met);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ust-alt{font-size:10.5px;color:var(--sol);font-weight:600;letter-spacing:.4px;margin-top:2px;}

.durum-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 16px;background:var(--tur-a);border-bottom:1px solid var(--cizgi);
  min-height:34px;}
.durum-y{font-size:10.5px;font-weight:700;color:var(--tur);}
.durum-d{display:flex;gap:5px;}
.durum-b{background:#fff;border:1px solid var(--cizgi);color:var(--sol);
  font-family:inherit;font-weight:800;font-size:10px;padding:5px 11px;
  border-radius:99px;cursor:pointer;}
.durum-b:hover{border-color:var(--tur);color:var(--tur);}

/* giriş ekranı */
.giris{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(160deg,#F1F6F7 0%,#E2EFF1 100%);
  font-family:'Montserrat',system-ui,sans-serif;}
.giris-kutu{width:100%;max-width:360px;background:#fff;border-radius:22px;
  padding:30px 26px;box-shadow:0 12px 40px rgba(18,48,58,.12);
  display:flex;flex-direction:column;align-items:center;}
.giris-b{font-size:21px;font-weight:900;letter-spacing:-.4px;color:#12303A;
  margin-top:14px;}
.giris-a{font-size:11.5px;font-weight:600;color:#6C8A93;margin-top:3px;}
.giris-kapilar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  width:100%;margin:22px 0 16px;}
.giris-k{background:#EDF4F5;border:1.5px solid transparent;border-radius:11px;
  padding:11px 6px;font-family:inherit;font-weight:800;font-size:12px;
  color:#6C8A93;cursor:pointer;}
.giris-k.etkin{background:#06788C;color:#fff;border-color:#06788C;}
.giris-alan{width:100%;}
.giris-alan input{text-align:center;letter-spacing:2px;font-size:17px;}
.giris-kutu .birincil{margin-top:16px;}
.giris-kutu .hata{width:100%;}
.giris-bekle{font-size:10.5px;font-weight:600;color:#8A5C0B;background:#FDF6E7;
  border-radius:9px;padding:9px 11px;margin-top:10px;line-height:1.5;
  text-align:center;}
.giris-not{font-size:10.5px;font-weight:600;color:#6C8A93;margin-top:16px;
  text-align:center;line-height:1.5;}
.demo-a{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--tur);}
.demo-d{display:flex;gap:4px;}
.demo-b{background:#FFFFFF;border:1px solid var(--cizgi);color:var(--sol);
  font-family:inherit;font-weight:800;font-size:10px;padding:6px 12px;
  border-radius:99px;cursor:pointer;}
.demo-b.etkin{background:var(--tur);color:#fff;border-color:var(--tur);}

.uyari{margin:12px 16px 0;padding:11px 14px;background:#FFF6E4;
  border:1px solid #F0DCB4;border-radius:12px;font-size:12px;
  font-weight:600;color:#8A6212;}

.govde{padding:16px;display:flex;flex-direction:column;gap:14px;}

/* kart */
.kart{background:var(--yzy);border:1px solid var(--cizgi);border-radius:20px;
  padding:18px;box-shadow:var(--golge);}
.ozet-ikili{display:contents;}
.kart.merkez{display:flex;flex-direction:column;align-items:center;gap:14px;
  background:linear-gradient(160deg,#FFFFFF 0%,#EFF8FA 100%);}
.kart-ust{display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:14px;}
.etiket{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--sol);margin-bottom:14px;}
.kart-ust .etiket,.merkez .etiket{margin-bottom:0;}
.link{background:none;border:none;color:var(--tur);font-family:inherit;
  font-weight:700;font-size:12px;cursor:pointer;padding:0;}
.sayac{font-size:11px;font-weight:700;color:var(--sol);white-space:nowrap;}
.satir-arasi{display:flex;justify-content:space-between;align-items:center;gap:10px;}

/* halka */
.halka-sar{position:relative;display:grid;place-items:center;}
.halka-ic{position:absolute;text-align:center;}
.halka-sayi{font-size:36px;font-weight:900;letter-spacing:-1.5px;line-height:1;color:var(--met);}
.halka-alt{font-size:11px;font-weight:600;color:var(--sol);margin-top:4px;}
.oran-yazi{font-size:13px;font-weight:600;color:var(--sol);}
.oran-yazi b{color:var(--tur);font-weight:800;}

/* ana ekran kahraman kartı */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:0;
  background:linear-gradient(152deg,#0C8AA0 0%,#076076 46%,#0B2E38 100%);
  box-shadow:0 10px 30px rgba(10,58,71,.22);}
.hero-foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.3;filter:saturate(.85);}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(170deg,rgba(8,70,85,.5) 0%,rgba(9,34,42,.9) 78%);}
.hero-ic{position:relative;z-index:2;padding:22px 22px 20px;color:#fff;}
.hero-selam{font-size:13px;font-weight:600;color:rgba(255,255,255,.72);
  letter-spacing:.1px;}
.hero-sayim{display:flex;align-items:baseline;gap:10px;margin-top:8px;}
.hero-rakam{font-size:68px;font-weight:900;letter-spacing:-4px;line-height:.92;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 18px rgba(0,0,0,.25);}
.hero-birim{font-size:14px;font-weight:700;color:rgba(255,255,255,.8);
  letter-spacing:-.1px;}
.hero-hedef{margin-top:14px;display:flex;flex-direction:column;gap:2px;}
.hero-hedef b{font-size:16px;font-weight:800;letter-spacing:-.3px;}
.hero-hedef span{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.65);}
.hero-yol{height:6px;border-radius:99px;background:rgba(255,255,255,.18);
  overflow:hidden;margin-top:16px;}
.hero-dolu{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,#5FE3C4,#9BF0A8);}
.hero-alt{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:11px;
  font-size:11.5px;font-weight:600;color:rgba(255,255,255,.7);}
.hero-alt b{color:#fff;font-weight:900;font-size:13px;}
.hero-motive{margin-top:14px;padding-top:12px;font-size:12.5px;font-weight:600;
  color:rgba(255,255,255,.82);border-top:1px solid rgba(255,255,255,.16);}

.kiyas{padding:10px 14px;border-radius:12px;font-size:12px;font-weight:700;}
.kiyas.artis{background:#E6F5EF;color:#0F7355;}
.kiyas.dusus{background:#FBEFEE;color:#A93A2D;}

/* kilometre taşları */
.rozetler{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.rozet-t{font-size:10.5px;font-weight:800;padding:6px 11px;border-radius:99px;
  background:var(--tur-a);color:var(--tur);}
.rozet-t.seri{background:#FFF1DE;color:#B0661A;}
.rozet-t.kitap{background:#F1EAFA;color:#6B45A0;}
.rozet-t.deneme{background:#E8F3E4;color:#3E6531;}
.sirada,.konu-ilerleme{margin-top:4px;}
.konu-ilerleme{margin-top:14px;padding-top:14px;border-top:1px solid var(--cizgi);}
.sirada-ust{display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;font-size:12.5px;font-weight:600;color:var(--sol);}
.sirada-ust b{color:var(--met);font-weight:800;}
.sirada-k{font-size:11px;font-weight:700;white-space:nowrap;}
.sirada-yol{height:8px;border-radius:99px;background:var(--yzy2);
  overflow:hidden;margin-top:7px;}
.sirada-dolu{height:100%;border-radius:99px;transition:width .5s;
  background:linear-gradient(90deg,var(--tur),var(--tur-p));}
.sirada-dolu.konu{background:linear-gradient(90deg,#6B45A0,#9B6FD0);}
.sirada-bitti{font-size:12.5px;font-weight:700;color:var(--yes);}

/* ikonlar ve bölüm renkleri */
.ikon{flex-shrink:0;}
.etiket.vurgu{display:flex;align-items:center;gap:6px;color:var(--bc);}

/* oynatma listesi */
.ol-satir{display:grid;grid-template-columns:1fr auto;gap:8px;}
.ol-sonuc{margin-top:14px;padding:12px;background:var(--yzy2);border-radius:12px;}
.ol-ust{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:12px;font-weight:600;color:var(--sol);margin-bottom:9px;}
.ol-ust b{color:var(--met);font-weight:800;}
.ol-liste{display:flex;flex-direction:column;gap:3px;max-height:260px;overflow-y:auto;}
.ol-v{display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px;
  padding:7px 10px;font-size:12px;font-weight:700;color:var(--met);}
.ol-v.var{opacity:.5;}
.ol-s{flex-shrink:0;width:22px;font-size:10px;font-weight:900;color:var(--sol);
  font-variant-numeric:tabular-nums;}
.ol-b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ol-v i{font-style:normal;font-size:9px;font-weight:800;color:var(--sol);
  background:var(--yzy2);padding:2px 6px;border-radius:4px;flex-shrink:0;}

/* tanıma formu */
.tf-ozet{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px;}
.tf-b{border:1px solid var(--cizgi);border-radius:13px;margin-bottom:7px;
  overflow:hidden;}
.tf-b.saglik{border-color:#EFBDB6;}
.tf-bas{width:100%;display:flex;align-items:center;gap:10px;padding:11px 13px;
  background:var(--yzy2);border:none;cursor:pointer;font-family:inherit;}
.tf-bas.acik{background:color-mix(in srgb, var(--bc) 11%, #fff);}
.tf-ikon{color:var(--bc);display:grid;place-items:center;flex-shrink:0;}
.tf-ad{flex:1;text-align:left;font-size:12.5px;font-weight:800;color:var(--met);}
.tf-say{font-size:10px;font-weight:800;color:var(--sol);
  background:#fff;padding:3px 8px;border-radius:99px;}
.tf-ok{font-size:16px;font-weight:900;color:var(--bc);width:14px;}
.tf-govde{padding:13px;display:flex;flex-direction:column;gap:10px;}
.tf-uyari{font-size:11.5px;font-weight:600;line-height:1.55;color:#8C2A20;
  background:#FBEFEE;border-radius:10px;padding:11px 12px;}
.tf-uyari b{font-weight:800;}

/* alışkanlık takibi */
.al-basl,.al-s{display:grid;grid-template-columns:1fr repeat(7,26px) 30px;
  gap:4px;align-items:center;}
.al-basl{padding-bottom:6px;}
.al-g{font-size:9.5px;font-weight:800;color:var(--sol);text-align:center;}
.al-g.bugun{color:var(--tur);}
.al-o{font-size:9px;font-weight:800;color:var(--sol);text-align:right;}
.al-s{padding:4px 0;border-top:1px solid var(--cizgi);}
.al-ad{font-size:11.5px;font-weight:800;color:var(--bc);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.al-k{width:26px;height:26px;border-radius:7px;border:2px solid var(--bc);
  background:#fff;color:#fff;font-size:13px;font-weight:900;line-height:1;
  cursor:pointer;font-family:inherit;display:grid;place-items:center;}
.al-k.dolu{background:var(--bc);}
.al-k:disabled{cursor:default;opacity:.5;}
.al-oran{font-size:10.5px;font-weight:900;color:var(--met);text-align:right;
  font-variant-numeric:tabular-nums;}
.al-halkalar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--cizgi);}
.al-h{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
.al-h-s{position:absolute;top:20px;font-size:11px;font-weight:900;color:var(--met);}
.al-h-a{font-size:9px;font-weight:700;color:var(--sol);text-align:center;
  line-height:1.2;}

/* yıldızlı değerlendirme */
.yildizlar{display:flex;align-items:center;gap:3px;margin-top:6px;}
.yildiz{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;
  color:var(--cizgi);padding:0 1px;font-family:inherit;}
.yildiz.dolu{color:#E8B021;}
.yildiz-y{font-size:11px;font-weight:700;color:var(--sol);margin-left:7px;}
.grs-p{color:#E8B021;font-size:11px;margin-left:7px;letter-spacing:1px;}

/* pomodoro */
.pomo{display:flex;flex-direction:column;align-items:center;}
.pomo .kart-ust{width:100%;}
.pomo.aktif{border-color:var(--bc);box-shadow:0 0 0 3px color-mix(in srgb, var(--bc) 14%, #fff);}
.pomo-turler{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
.pomo-t{background:var(--yzy2);border:1.5px solid transparent;border-radius:99px;
  padding:7px 13px;font-family:inherit;font-weight:800;font-size:11px;
  color:var(--sol);cursor:pointer;}
.pomo-t i{font-style:normal;font-weight:700;opacity:.7;}
.pomo-t.etkin{background:var(--bc);color:#fff;}
.pomo-halka{position:relative;display:grid;place-items:center;}
.pomo-ic{position:absolute;text-align:center;}
.pomo-sayi{font-size:38px;font-weight:900;letter-spacing:-2px;color:var(--met);
  font-variant-numeric:tabular-nums;line-height:1;}
.pomo-alt{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--bc);
  margin-top:5px;}
.pomo-sec{width:100%;margin-top:14px;background:var(--yzy2);border:1.5px solid transparent;
  border-radius:11px;padding:10px 12px;font-family:inherit;font-weight:700;
  font-size:12.5px;color:var(--met);outline:none;}
.pomo-dugmeler{display:flex;gap:8px;width:100%;margin-top:12px;}
.pomo-b{margin-top:0;flex:1;background:var(--bc);box-shadow:none;}
.pomo-b:hover{opacity:.9;background:var(--bc);}

/* ders hedefleri */
.dh-liste{display:flex;flex-direction:column;gap:5px;}
.dh{display:grid;grid-template-columns:46px 1fr 78px;gap:9px;align-items:center;
  padding:5px 0;border-top:1px solid var(--cizgi);}
.dh:first-child{border-top:none;}
.dh-ad{font-size:11.5px;font-weight:900;}
.dh-tam{font-size:11.5px;font-weight:600;color:var(--sol);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.dh-giris{background:var(--yzy2);border:1.5px solid transparent;border-radius:9px;
  padding:8px 10px;font-family:inherit;font-weight:800;font-size:13px;
  color:var(--met);outline:none;width:100%;text-align:center;}
.dh-giris:focus{border-color:var(--tur);background:#fff;}

.dhb-liste{display:flex;flex-direction:column;gap:9px;}
.dhb{display:grid;grid-template-columns:44px 1fr 64px;gap:10px;align-items:center;}
.dhb-ad{font-size:11px;font-weight:900;color:var(--bc);}
.dhb-yol{height:9px;border-radius:99px;background:var(--yzy2);overflow:hidden;}
.dhb-dolu{height:100%;border-radius:99px;background:var(--bc);transition:width .5s;}
.dhb-s{font-size:12px;font-weight:900;text-align:right;color:var(--met);
  font-variant-numeric:tabular-nums;}
.dhb-s i{font-style:normal;font-weight:700;color:var(--sol);font-size:10.5px;}
.dhb-s.tam{color:var(--yes);}

/* kısayol kutuları */
.kisayollar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ks{background:var(--yzy);border:1px solid var(--cizgi);border-radius:16px;
  padding:13px 6px 11px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  box-shadow:var(--golge);transition:transform .12s, box-shadow .12s;}
.ks:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(18,48,58,.1);}
.ks-ikon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:var(--bc);background:color-mix(in srgb, var(--bc) 13%, #fff);
  margin-bottom:3px;}
.ks-ad{font-size:11px;font-weight:800;color:var(--met);letter-spacing:-.1px;}
.ks-alt{font-size:9.5px;font-weight:700;color:var(--sol);}

/* mini istatistik */
.dortlu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.dortlu.ikili{grid-template-columns:repeat(2,1fr);}
.mini{background:var(--yzy);border:1px solid var(--cizgi);border-radius:14px;
  padding:13px 6px;text-align:center;box-shadow:var(--golge);}
.mini.duz{background:var(--yzy2);border-color:transparent;box-shadow:none;}
.mini-s{font-size:19px;font-weight:900;letter-spacing:-.5px;color:var(--met);}
.mini-a{font-size:9px;font-weight:700;color:var(--sol);letter-spacing:.3px;margin-top:3px;}

/* hedefler */
.hedef-sar{display:flex;flex-direction:column;gap:14px;}
.hedef-a{font-size:11px;font-weight:600;color:var(--sol);margin-bottom:4px;}
.hedef-d{font-size:16px;font-weight:800;letter-spacing:-.3px;}
.hedef-d.buyuk{font-size:24px;color:var(--tur);}

/* hedef okul kartı */
.hk{position:relative;height:158px;border-radius:16px;overflow:hidden;
  background:linear-gradient(135deg,#0B8299 0%,#055C6D 100%);}
.hk-gorsel{position:absolute;left:-46px;top:-6px;bottom:-6px;width:calc(50% + 46px);
  transform:skewX(-12deg);overflow:hidden;
  border-right:5px solid #FFFFFF;box-shadow:6px 0 18px rgba(3,45,54,.28);}
.hk-gorsel img{position:absolute;left:-28%;top:0;width:156%;height:100%;
  object-fit:cover;transform:skewX(12deg);}
.hk-mono{position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(150deg,#25B0C6 0%,#0A7A8E 55%,#065266 100%);}
.hk-mono::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.22),transparent 60%);}
.hk-mono span{position:relative;transform:skewX(12deg);color:#fff;
  font-size:38px;font-weight:900;letter-spacing:1px;
  text-shadow:0 2px 10px rgba(0,0,0,.18);}
.hk-bilgi{position:absolute;right:0;top:0;bottom:0;left:52%;
  padding:16px 16px 16px 10px;display:flex;flex-direction:column;
  justify-content:center;gap:7px;}
.hk-etiket{font-size:8.5px;font-weight:800;letter-spacing:1.4px;
  color:rgba(255,255,255,.65);}
.hk-ad{font-size:16px;font-weight:800;line-height:1.25;color:#fff;
  letter-spacing:-.3px;}
.hk-rozet{display:inline-flex;align-items:baseline;gap:6px;align-self:flex-start;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);
  border-radius:99px;padding:5px 11px;margin-top:2px;}
.hk-r-s{font-size:15px;font-weight:900;color:#fff;letter-spacing:-.3px;
  font-variant-numeric:tabular-nums;}
.hk-r-a{font-size:9px;font-weight:700;color:rgba(255,255,255,.7);}

/* öğrenci kartı */
.ogr-kart{background:var(--yzy);border:1px solid var(--cizgi);
  border-radius:18px;padding:16px;box-shadow:var(--golge);}
.ogr-ust{display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;cursor:pointer;}
.ogr-ad{font-size:16px;font-weight:800;letter-spacing:-.3px;}
.ogr-alt{font-size:11px;font-weight:600;color:var(--sol);margin-top:3px;}
.rozet{font-size:9px;font-weight:800;letter-spacing:.5px;padding:5px 10px;
  border-radius:99px;white-space:nowrap;flex-shrink:0;}
.rozet.iyi{color:#0F7355;background:#DFF3EC;}
.rozet.orta{color:#8A5C0B;background:#FBEED2;}
.rozet.kritik{color:#A93A2D;background:#FBE3E0;}
.seviye-rozet-sar{margin-top:9px;}
.seviye-rozet{font-size:9px;font-weight:800;letter-spacing:1px;padding:4px 9px;
  border-radius:6px;background:var(--yzy2);color:var(--sol);}
.seviye-rozet.yks{color:var(--tur);background:var(--tur-a);}
.ogr-bar{display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer;}
.ogr-yol{flex:1;height:8px;background:#E5EFF1;border-radius:99px;overflow:hidden;}
.ogr-dolu{height:100%;background:linear-gradient(90deg,var(--tur),var(--tur-p));
  border-radius:99px;transition:width .5s;}
.ogr-oran{font-size:11px;font-weight:700;color:var(--sol);white-space:nowrap;}
.ogr-oran b{color:var(--met);font-size:13px;font-weight:900;}
.ogr-alt-satir{display:flex;justify-content:space-between;margin-top:11px;
  font-size:11px;font-weight:600;color:var(--sol);}
.ogr-alt-satir b{color:var(--met);font-weight:800;}
.ogr-dugmeler{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;}
.ufak{background:var(--yzy2);border:1px solid transparent;border-radius:9px;
  padding:8px 12px;color:var(--tur);font-family:inherit;font-weight:700;
  font-size:11px;cursor:pointer;}
.ufak:hover{border-color:var(--tur);}
.ufak.tehlike{color:var(--kir);}

.kutucuk{margin-top:14px;padding:14px;background:var(--yzy2);
  border-radius:14px;}
.kutucuk-a{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--sol);
  margin-bottom:8px;}
.link-metin{font-size:13px;font-weight:700;color:var(--tur);
  word-break:break-all;margin-bottom:14px;}
.kod-ikili{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.kod-kutu{background:#FFFFFF;border:1px solid var(--cizgi);border-radius:12px;
  padding:11px;text-align:center;}
.kod-a{font-size:8.5px;font-weight:800;letter-spacing:1px;color:var(--sol);}
.kod-d{font-size:20px;font-weight:900;letter-spacing:2px;color:var(--tur);
  margin:5px 0 9px;font-variant-numeric:tabular-nums;}
.kod-kutu .ufak{width:100%;font-size:10px;padding:7px 4px;}
.rapor{width:100%;background:#FFFFFF;border:1px solid var(--cizgi);border-radius:11px;
  padding:12px;color:var(--met);font-family:'Montserrat',sans-serif;font-size:11.5px;
  font-weight:600;line-height:1.65;resize:vertical;outline:none;}
.ikincil.tam{width:100%;margin-top:10px;}

/* seviye seçimi */
.secim-ikili{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sinif-secim{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.sinif-b{background:var(--yzy2);border:1.5px solid transparent;border-radius:11px;
  padding:9px 2px;cursor:pointer;font-family:inherit;display:flex;
  flex-direction:column;align-items:center;gap:1px;}
.sinif-b.etkin{background:var(--tur);border-color:var(--tur);}
.sinif-ad{font-size:15px;font-weight:900;color:var(--met);}
.sinif-alt{font-size:8px;font-weight:800;letter-spacing:.4px;color:var(--sol);}
.sinif-b.etkin .sinif-ad,.sinif-b.etkin .sinif-alt{color:#fff;}
.secim{background:var(--yzy2);border:1.5px solid transparent;border-radius:13px;
  padding:13px 10px;cursor:pointer;font-family:inherit;display:flex;
  flex-direction:column;gap:3px;align-items:center;}
.secim.etkin{background:var(--tur);border-color:var(--tur);}
.secim-ad{font-size:15px;font-weight:900;letter-spacing:.4px;color:var(--met);}
.secim.etkin .secim-ad{color:#fff;}
.secim-alt{font-size:9.5px;font-weight:700;color:var(--sol);}
.secim.etkin .secim-alt{color:rgba(255,255,255,.8);}

/* form */
.form{display:flex;flex-direction:column;gap:11px;}
.uclu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.ikili-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.alan{display:flex;flex-direction:column;gap:5px;}
.alan span{font-size:10px;font-weight:700;color:var(--sol);letter-spacing:.5px;}
.alan input,.konu-ekle input,.dn-satir input{
  background:var(--yzy2);border:1.5px solid transparent;border-radius:11px;
  padding:11px 12px;color:var(--met);font-family:inherit;font-weight:700;
  font-size:15px;width:100%;outline:none;}
.alan input:focus,.konu-ekle input:focus,.dn-satir input:focus{
  border-color:var(--tur);background:#fff;}
.alan input::placeholder{color:#A8BEC3;font-weight:600;}

/* net tabelası */
.net-tabela{display:flex;gap:10px;margin:16px 0 4px;}
.net-yan{background:var(--yzy2);border-radius:14px;padding:12px 16px;
  display:flex;flex-direction:column;justify-content:center;min-width:74px;}
.net-yan-a{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--sol);}
.net-yan-s{font-size:22px;font-weight:900;margin-top:2px;color:var(--met);}
.net-orta{flex:1;background:linear-gradient(135deg,#0B8399,#06788C);
  border-radius:14px;padding:12px 18px;
  display:flex;flex-direction:column;justify-content:center;}
.net-a{font-size:9px;font-weight:800;letter-spacing:1.6px;color:rgba(255,255,255,.75);}
.net-s{font-size:36px;font-weight:900;letter-spacing:-2px;line-height:1.05;
  color:#fff;font-variant-numeric:tabular-nums;}

.hata{margin-top:12px;padding:10px 13px;background:#FBE3E0;
  border:1px solid #F2C4BE;border-radius:11px;
  font-size:12px;font-weight:600;color:#A93A2D;}
.ipuc{font-size:10px;font-weight:600;color:var(--sol);opacity:.85;
  margin-top:10px;text-align:center;}

/* düğmeler */
.birincil{width:100%;margin-top:14px;background:var(--tur);border:none;
  border-radius:13px;padding:14px;color:#fff;font-family:inherit;
  font-weight:800;font-size:14px;letter-spacing:.2px;cursor:pointer;
  box-shadow:0 2px 8px rgba(6,120,140,.22);}
.birincil:hover{background:#056A7C;}
.birincil:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.birincil.genis{margin-top:0;}
.ikincil{background:#FFFFFF;border:1px solid var(--cizgi);border-radius:10px;
  padding:9px 14px;color:var(--tur);font-family:inherit;font-weight:700;
  font-size:12px;cursor:pointer;white-space:nowrap;}
.ikincil:hover{border-color:var(--tur);}

/* çipler */
.cipler{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.cipler.yapisik{margin-bottom:0;}
.cip{background:#FFFFFF;border:1.5px solid var(--cizgi);border-radius:99px;
  padding:9px 14px;color:var(--sol);font-family:inherit;font-weight:800;
  font-size:11px;letter-spacing:.4px;cursor:pointer;white-space:nowrap;}
.cip.etkin{background:var(--tur);color:#fff;border-color:var(--tur);}

.cip-serit{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:center;}
@media (min-width: 640px){
  .cip-serit{flex-wrap:wrap;overflow-x:visible;}
  .serit-ayrac{align-self:center;height:20px;}
}
.cip-serit::-webkit-scrollbar{display:none;}
.serit-ayrac{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:1px;
  color:var(--tur);padding:0 8px 0 4px;border-left:1px solid var(--cizgi);
  margin-left:2px;align-self:stretch;display:flex;align-items:center;}

/* soru tablosu */
.gun-ust{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.gun-t{font-weight:800;font-size:14px;}
.gun-o{font-size:11px;font-weight:700;color:var(--tur);}
.tablo{display:flex;flex-direction:column;}
.tr{display:grid;grid-template-columns:1fr 26px 26px 26px 26px 46px;gap:4px;
  padding:9px 0;border-top:1px solid var(--cizgi);
  font-size:12px;font-weight:700;align-items:center;text-align:center;}
.tr.basl{border-top:none;font-size:9px;font-weight:800;color:var(--sol);
  letter-spacing:.7px;padding-bottom:6px;}
.hucre-konu{text-align:left;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.hucre-konu b{color:var(--tur);font-weight:800;margin-right:5px;}
.ye{color:var(--yes);} .kr{color:var(--kir);} .gr{color:var(--sol);}
.net-h{font-weight:900;font-variant-numeric:tabular-nums;color:var(--met);}

/* konu takibi */

.konu-basl-h{font-size:7.5px;font-weight:800;color:var(--sol);
  letter-spacing:.4px;text-align:center;}

.konu-ad{font-size:12.5px;font-weight:600;line-height:1.3;}
.kutu{height:28px;border-radius:8px;font-size:11px;background:var(--yzy2);border:1.5px solid transparent;
  color:#fff;font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;}
.kutu.dolu{background:var(--tur);}
.kutu:hover{border-color:var(--tur);}
.konu-ekle{display:flex;gap:8px;margin-top:16px;}

/* özet görev satırı */
.gorev{display:flex;align-items:center;gap:12px;padding:11px 0;
  border-top:1px solid var(--cizgi);}
.gorev-kutu{width:32px;height:32px;flex-shrink:0;border-radius:10px;
  background:var(--yzy2);border:1.5px solid transparent;color:var(--sol);
  font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;}
.gorev-kutu.dolu{background:var(--yes);color:#fff;}
.gorev-yazi{flex:1;min-width:0;}
.gorev-ders{font-size:9.5px;font-weight:800;letter-spacing:.8px;color:var(--tur);}
.gorev-konu{font-size:13.5px;font-weight:700;margin-top:2px;line-height:1.3;}
.gorev.bitti .gorev-konu{text-decoration:line-through;color:var(--sol);}
.gorev.bitti .gorev-ders{opacity:.5;}
.gorev-vid{font-weight:700;color:var(--sol);letter-spacing:0;}

/* takvim */
.tk-ust-kart{padding:14px 16px;}
.tk-nav{display:flex;align-items:center;gap:10px;}
.tk-ok{width:32px;height:34px;flex-shrink:0;border-radius:10px;background:var(--yzy2);
  border:none;color:var(--tur);font-size:19px;line-height:1;cursor:pointer;
  font-family:inherit;font-weight:800;}
.tk-ok.hafta{font-size:15px;opacity:.75;}
.tk-ok:hover{background:var(--tur-a);opacity:1;}
.tk-tarih{margin-top:6px;background:var(--yzy2);border:1px solid transparent;
  border-radius:8px;padding:4px 8px;font-family:inherit;font-weight:700;
  font-size:11px;color:var(--sol);outline:none;cursor:pointer;}
.tk-tarih:hover,.tk-tarih:focus{border-color:var(--tur);color:var(--met);}
.tk-aralik{flex:1;text-align:center;min-width:0;}
.tk-aralik-b{font-size:14.5px;font-weight:800;letter-spacing:-.2px;}
.tk-aralik-a{font-size:10.5px;font-weight:700;color:var(--sol);margin-top:2px;}
.tk-arac{display:flex;justify-content:space-between;align-items:center;
  gap:8px;margin-top:12px;flex-wrap:wrap;}

/* görev penceresi */
.gd-perde{position:fixed;inset:0;z-index:60;background:rgba(10,30,36,.55);
  display:flex;align-items:center;justify-content:center;padding:14px;}
.gd{width:100%;max-width:420px;max-height:min(88vh, 660px);background:#fff;
  border-radius:18px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.3);}
.gd-ust{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;
  border-bottom:1px solid var(--cizgi);flex-shrink:0;}
.gd-ust.renkli{border-left:4px solid var(--c);}
.gd-a{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--sol);}
.gd-ust.renkli .gd-a{color:var(--c);}
.gd-k{font-size:15px;font-weight:800;letter-spacing:-.2px;margin-top:2px;}
.gd-b{font-size:11px;font-weight:700;color:var(--sol);margin-top:3px;}
.gd-govde{flex:1;overflow-y:auto;padding:12px 14px;}
.gd-e{font-size:8.5px;font-weight:800;letter-spacing:1.1px;color:var(--sol);
  margin:12px 0 6px;}
.gd-e:first-child{margin-top:0;}
.gd-ara{width:100%;background:var(--yzy2);border:1.5px solid transparent;
  border-radius:9px;padding:8px 10px;font-family:inherit;font-weight:600;
  font-size:12.5px;color:var(--met);outline:none;margin-bottom:6px;}
.gd-ara:focus{border-color:var(--tur);background:#fff;}
.gd-konular{display:flex;flex-direction:column;gap:3px;max-height:160px;
  overflow-y:auto;padding-right:2px;}
.gd-konu{display:flex;justify-content:space-between;align-items:center;gap:8px;
  text-align:left;background:var(--yzy2);border:1.5px solid transparent;
  border-radius:8px;padding:7px 10px;font-family:inherit;font-weight:700;
  font-size:12px;color:var(--met);cursor:pointer;}
.gd-konu i{font-style:normal;font-size:8px;font-weight:800;color:var(--tur);
  background:var(--tur-a);padding:2px 5px;border-radius:4px;flex-shrink:0;}
.gd-konu.etkin{background:var(--tur);color:#fff;border-color:var(--tur);}
.gd-konu.etkin i{background:rgba(255,255,255,.25);color:#fff;}
.gd-ayrac{font-size:8px;font-weight:800;letter-spacing:1px;color:var(--sol);
  padding:8px 2px 3px;}
.gd-ayrac:first-child{padding-top:0;}
.gd-serbest{font-size:11.5px;font-weight:700;color:var(--tur);
  background:var(--tur-a);border-radius:8px;padding:9px 11px;margin-top:4px;}
.gd-zaman{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.gd-zaman.uclu-z{grid-template-columns:1.3fr 1fr .8fr;}
.gd-zaman input{background:var(--yzy2);border:1.5px solid transparent;border-radius:9px;
  padding:8px 10px;font-family:inherit;font-weight:700;font-size:12.5px;
  color:var(--met);outline:none;width:100%;}
.gd-zaman input:focus{border-color:var(--tur);background:#fff;}
.gd-sure{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.gd-ikili{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;}
.gd-ikili .gd-ara{margin-bottom:0;}
.gd-mini-e{font-size:9px;font-weight:700;color:var(--sol);}
.gd-s{background:var(--yzy2);border:1.5px solid transparent;border-radius:99px;
  padding:6px 11px;font-family:inherit;font-weight:800;font-size:11px;
  color:var(--sol);cursor:pointer;}
.gd-s.etkin{background:var(--tur);color:#fff;}
.gd-onay{display:flex;align-items:center;gap:8px;width:100%;margin-top:14px;
  background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
  font-size:11.5px;font-weight:700;color:var(--sol);text-align:left;}
.gd-onay.etkin{color:var(--tur);}
.gd-onay .onay-k{width:20px;height:20px;border-radius:6px;background:#fff;
  border:1.5px solid var(--cizgi);}
.gd-onay.etkin .onay-k{background:var(--tur);border-color:var(--tur);}
.gd-d{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
.gd-alt{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-top:1px solid var(--cizgi);background:#FBFDFD;flex-shrink:0;}
.gd-secim{flex:1;font-size:11.5px;font-weight:700;color:var(--met);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gd-kaydet{margin:0;width:auto;padding:11px 22px;flex-shrink:0;}

.gun-serit{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.gs-b{background:var(--gz, var(--yzy));border:1.5px solid var(--cizgi);border-radius:12px;
  padding:8px 2px;cursor:pointer;font-family:inherit;display:flex;
  flex-direction:column;align-items:center;gap:1px;box-shadow:var(--golge);}
.gs-b.bugun{border-color:var(--gb);border-width:2px;}
.gs-b.etkin{background:var(--gb);border-color:var(--gb);}
.gs-ad{font-size:9px;font-weight:900;letter-spacing:.3px;color:var(--gb, var(--sol));}
.gs-t{font-size:15px;font-weight:900;color:var(--met);line-height:1.1;}
.gs-n{font-size:9px;font-weight:800;color:var(--sol);opacity:.75;}
.gs-n.tam{color:var(--yes);opacity:1;}
.gs-b.etkin .gs-ad,.gs-b.etkin .gs-t,.gs-b.etkin .gs-n{color:#fff;opacity:.9;}

/* haftalık liste görünümü */
.hl{display:flex;flex-direction:column;gap:10px;}
.hl-gun{background:var(--yzy);border:1px solid var(--cizgi);border-radius:16px;
  overflow:hidden;box-shadow:var(--golge);}
.hl-gun.bugun{border-color:var(--gb);box-shadow:0 0 0 2px var(--gz),var(--golge);}
.hl-bas{display:flex;align-items:baseline;gap:8px;padding:10px 14px;
  background:var(--gz, var(--yzy2));border-bottom:2px solid var(--gb, var(--cizgi));}

.hl-ad{font-size:11px;font-weight:900;letter-spacing:1px;color:var(--gb, var(--sol));}
.hl-t{font-size:16px;font-weight:900;color:var(--gb, var(--met));}

.hl-govde{padding:6px 10px 10px;display:flex;flex-direction:column;gap:3px;}
.hl-bos{font-size:12px;font-weight:700;color:var(--sol);opacity:.5;padding:8px 4px;}
.hl-s{display:flex;align-items:center;gap:8px;border-radius:9px;padding:2px;}
.hl-saat{flex-shrink:0;width:46px;display:flex;flex-direction:column;
  align-items:flex-start;line-height:1.15;}
.hl-saat b{font-size:12px;font-weight:900;color:var(--met);
  font-variant-numeric:tabular-nums;}
.hl-saat i{font-style:normal;font-size:12px;font-weight:800;color:var(--sol);opacity:.45;}
.hl-saat u{text-decoration:none;font-size:9px;font-weight:700;color:var(--sol);}
.hl-s:hover{background:var(--yzy2);}
.hl-kutu{flex-shrink:0;width:24px;height:24px;border-radius:7px;cursor:pointer;
  border:2px solid var(--c);background:#fff;color:#fff;font-size:13px;font-weight:900;
  line-height:1;font-family:inherit;display:grid;place-items:center;}
.hl-kutu.dolu{background:var(--c);}
.hl-kutu:disabled{cursor:default;opacity:.55;}
.hl-metin{flex:1;min-width:0;background:none;border:none;cursor:pointer;
  font-family:inherit;text-align:left;padding:5px 2px;display:flex;
  align-items:baseline;gap:7px;flex-wrap:wrap;}
.hl-ders{font-size:10px;font-weight:900;color:var(--c);letter-spacing:.3px;
  flex-shrink:0;}
.hl-konu{font-size:13px;font-weight:700;color:var(--met);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hl-ek{font-size:10px;font-weight:700;color:var(--sol);flex-shrink:0;}
.hl-s.bitti .hl-konu{text-decoration:line-through;opacity:.5;}
.hl-s.bitti .hl-ders,.hl-s.bitti .hl-ek{opacity:.5;}
.hl-ekle{margin-top:5px;background:none;border:1px dashed var(--cizgi);
  border-radius:9px;padding:8px;font-family:inherit;font-weight:800;font-size:11px;
  color:var(--sol);cursor:pointer;}
.hl-ekle:hover{border-color:var(--tur);color:var(--tur);}
.hl-alt{display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:var(--yzy2);border-top:1px solid var(--cizgi);}
.hl-yol{flex:1;height:7px;border-radius:99px;background:var(--cizgi);overflow:hidden;}
.hl-dolu{height:100%;border-radius:99px;transition:width .4s;
  background:linear-gradient(90deg,var(--tur),var(--tur-p));}
.hl-oran{font-size:10.5px;font-weight:800;color:var(--sol);white-space:nowrap;
  font-variant-numeric:tabular-nums;}
.hl-oran.tam{color:var(--yes);}

/* takvim ızgarası */
.tkv{overflow:auto;-webkit-overflow-scrolling:touch;
  max-height:min(560px, calc(100vh - 300px));
  background:var(--yzy);border:1px solid var(--cizgi);border-radius:16px;
  box-shadow:var(--golge);}
.tkv-tablo{display:grid;grid-template-columns:52px repeat(var(--gun), minmax(104px,1fr));
  min-width:100%;position:relative;touch-action:pan-y;}

.tkv-kose{position:sticky;left:0;top:0;z-index:6;background:var(--yzy);
  border-right:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi);}
.tkv-tg-a{display:flex;align-items:center;justify-content:center;font-size:8px;
  font-weight:800;letter-spacing:.6px;color:var(--sol);}
.tkv-kopya{position:absolute;top:2px;right:3px;width:17px;height:17px;
  border-radius:5px;background:transparent;border:none;color:var(--sol);
  font-size:11px;line-height:1;cursor:pointer;opacity:0;transition:opacity .12s;
  font-family:inherit;}
.tkv-baslik:hover .tkv-kopya{opacity:1;}
.tkv-kopya:hover{background:var(--tur-a);color:var(--tur);}
.tkv-baslik{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;
  padding:7px 2px;background:var(--gz, var(--yzy2));
  border-left:1.5px solid #C6D6DA;border-bottom:2px solid var(--gb, var(--cizgi));border-bottom:1px solid var(--cizgi);
  border-left:1px solid var(--cizgi);background:var(--yzy);
  position:sticky;top:0;z-index:3;}
.tkv-b-ad{font-size:9px;font-weight:800;letter-spacing:.8px;color:var(--sol);}
.tkv-b-t{font-size:14px;font-weight:900;color:var(--met);line-height:1.1;}
.tkv-baslik.bugun{box-shadow:inset 0 0 0 2px var(--gb);}
.tkv-baslik.bugun .tkv-b-t,.tkv-baslik.bugun .tkv-b-ad{color:var(--tur);}

.tkv-tumgun{min-height:24px;padding:2px;display:flex;flex-direction:column;gap:3px;
  border-left:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi);
  background:#FBFDFD;}
.tkv-mini{text-align:left;line-height:1.2;
  background:color-mix(in srgb, var(--c) 16%, #fff);border:1px dashed var(--c);
  border-left:3px solid var(--c);border-radius:6px;padding:3px 5px;
  font-family:inherit;font-size:8.5px;font-weight:700;color:var(--met);
  cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tkv-mini b{color:var(--c);margin-right:3px;}
.tkv-mini.bitti{opacity:.45;text-decoration:line-through;}

.tkv-saatler{position:sticky;left:0;z-index:2;background:var(--yzy);
  border-right:1px solid var(--cizgi);}
.tkv-saat{font-size:9px;font-weight:800;color:var(--sol);text-align:right;
  padding:2px 6px 0 0;font-variant-numeric:tabular-nums;
  border-top:1px solid var(--cizgi);}
.tkv-saat:first-child{border-top:none;}

/* Üç kademeli ızgara: tam saat kalın, yarım saat orta, 15 dakika silik.
   Çizgiler günün kendi rengini alır. DİKKAT: buradan sonra "background"
   kısayolu YAZILMAZ — kısayol bu katmanları ve gün rengini siler. */
.tkv-sutun{position:relative;cursor:pointer;
  --ck: var(--gb, #1F4E6B);
  --yarim: calc(var(--ceyrek) * 2);
  border-left:1.5px solid color-mix(in srgb, var(--ck) 38%, #fff);
  background-color:var(--gz, #fff);
  background-image:
    /* tam saat — en belirgin */
    repeating-linear-gradient(to bottom,
      color-mix(in srgb, var(--ck) 58%, transparent) 0,
      color-mix(in srgb, var(--ck) 58%, transparent) 1.6px,
      transparent 1.6px, transparent var(--h)),
    /* yarım saat */
    repeating-linear-gradient(to bottom,
      transparent 0, transparent calc(var(--yarim) - 1.2px),
      color-mix(in srgb, var(--ck) 44%, transparent) calc(var(--yarim) - 1.2px),
      color-mix(in srgb, var(--ck) 44%, transparent) var(--yarim),
      transparent var(--yarim), transparent var(--h)),
    /* 15 dakika — en silik */
    repeating-linear-gradient(to bottom,
      transparent 0, transparent calc(var(--ceyrek) - 1px),
      color-mix(in srgb, var(--ck) 17%, transparent) calc(var(--ceyrek) - 1px),
      color-mix(in srgb, var(--ck) 17%, transparent) var(--ceyrek),
      transparent var(--ceyrek), transparent calc(var(--ceyrek) * 2));
  background-repeat:repeat;background-position:0 0;}
.tkv-sutun.bugun{background-color:color-mix(in srgb, var(--gz, #fff) 88%, var(--ck));
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--ck) 45%, transparent);}
.tkv-simdi{position:absolute;left:0;right:0;height:2px;background:#D9534F;z-index:5;}
.tkv-simdi::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;
  border-radius:50%;background:#D9534F;}

.tkv-blok.kisa{flex-direction:row;align-items:center;gap:5px;padding:0 6px;}
.tkv-blok.tasan{z-index:4;box-shadow:0 1px 4px rgba(18,48,58,.14);}
.tkv-blok.tasan:hover{z-index:9;}
.tkv-blok.kisa .tkv-blok-s{font-size:8.5px;flex-shrink:0;}
.tkv-blok.kisa .tkv-blok-k{font-size:10px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;line-height:1.1;}
.tkv-blok.kisa .ct-rozet{display:none;}
.tkv-blok{position:absolute;z-index:3;border-radius:6px;overflow:hidden;
  background:color-mix(in srgb, var(--c) 30%, #fff);
  border:1px solid color-mix(in srgb, var(--c) 62%, #fff);
  border-left:3px solid var(--c);
  padding:2px 4px 2px 5px;cursor:grab;touch-action:none;
  display:flex;flex-direction:column;gap:1px;}
.tkv-blok.tekrar{background:color-mix(in srgb, var(--c) 12%, #fff);
  border-style:dashed;border-left-style:solid;}
.tkv-blok.deneme{background:color-mix(in srgb, var(--c) 88%, #fff);border-width:0;}
.tkv-blok.etkinlik{background:color-mix(in srgb, var(--c) 24%, #fff);
  border-style:solid;border-color:color-mix(in srgb, var(--c) 55%, #fff);}
.tkv-blok.deneme .tkv-blok-s,.tkv-blok.deneme .tkv-blok-k,
.tkv-blok.deneme .tkv-blok-k b{color:#fff;}
.tkv-blok.bitti{opacity:.5;}
.tkv-blok.bitti .tkv-blok-k{text-decoration:line-through;}
/* Taşınırken saat etiketi blok sınırının dışına çıkar; overflow:hidden
   onu kırptığı için sürükleme sırasında görünür hâle getiriliyor. */
.tkv-blok.suruklenen{z-index:30;cursor:grabbing;overflow:visible;
  box-shadow:0 8px 22px rgba(18,48,58,.3);
  outline:2px solid var(--c);outline-offset:-1px;}
.ct-rozet{font-style:normal;font-size:7px;font-weight:900;letter-spacing:.3px;
  color:#fff;background:var(--c);padding:1px 4px;border-radius:3px;margin-left:4px;
  vertical-align:middle;}
.tkv-mini .ct-rozet{margin:0 4px 0 0;}
.tkv-blok-s{font-size:8px;font-weight:900;
  color:color-mix(in srgb, var(--c) 78%, #000);
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.tkv-blok-k{font-size:9.5px;font-weight:700;color:var(--met);line-height:1.2;
  overflow:hidden;}
.tkv-blok-k b{color:color-mix(in srgb, var(--c) 75%, #000);}
.blk-parca{display:inline-block;font-style:normal;font-size:8.5px;font-weight:800;
  background:rgba(255,255,255,.75);color:color-mix(in srgb, var(--c) 80%, #000);
  padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle;}
.gd-parca{display:inline-block;font-size:10px;font-weight:800;color:var(--tur);
  background:var(--tur-a);padding:2px 8px;border-radius:99px;margin-left:7px;
  vertical-align:middle;}
.gd-sure .gd-s i{font-style:normal;font-weight:700;opacity:.7;}
.gd-sure .gd-s b{color:var(--yes);}
.gd-s.etkin b{color:#fff;}
.tkv-tut{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;
  touch-action:none;}
.tkv-yan{position:absolute;top:0;bottom:9px;width:7px;cursor:ew-resize;
  touch-action:none;z-index:2;}
.tkv-yan.sol{left:0;} .tkv-yan.sag{right:0;}
.tkv-yan::after{content:"";position:absolute;top:50%;width:3px;height:16px;
  transform:translateY(-50%);border-radius:2px;opacity:0;transition:opacity .12s;
  background:color-mix(in srgb, var(--c) 70%, #fff);}
.tkv-yan.sol::after{left:1px;} .tkv-yan.sag::after{right:1px;}
.tkv-blok:hover .tkv-yan::after{opacity:1;}
.tkv-hedef{position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  background:var(--met);color:#fff;font-size:11.5px;font-weight:900;
  padding:3px 11px;border-radius:99px;z-index:40;white-space:nowrap;
  border:2px solid #fff;letter-spacing:.2px;
  box-shadow:0 3px 10px rgba(18,48,58,.38);font-variant-numeric:tabular-nums;}
/* Blokun kendi saati de sürüklerken hedef saate döner */
.tkv-blok-s.tasiniyor{background:var(--met);color:#fff;border-radius:4px;
  padding:0 4px;}
.tkv-yay-sayi{position:absolute;top:2px;right:4px;font-size:8px;font-weight:900;
  color:#fff;background:var(--c);padding:1px 5px;border-radius:4px;z-index:4;}
.zum{display:inline-flex;gap:3px;margin-left:4px;}
.zum-b{width:28px;height:30px;border-radius:8px;background:var(--yzy2);border:none;
  color:var(--tur);font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;
  line-height:1;}
.zum-b:hover:not(:disabled){background:var(--tur-a);}
.zum-b:disabled{opacity:.3;cursor:not-allowed;}
.tkv-sutun.pano{cursor:copy;background-color:rgba(6,120,140,.05);}
.tk-sag{display:flex;align-items:center;gap:6px;}
.geri-b{width:36px;height:36px;border-radius:10px;background:var(--yzy2);
  border:1px solid transparent;color:var(--tur);font-size:17px;line-height:1;
  cursor:pointer;font-family:inherit;font-weight:700;}
.geri-b:hover:not(:disabled){border-color:var(--tur);}
.geri-b:disabled{opacity:.3;cursor:not-allowed;}
.pano{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 13px;
  background:var(--tur-a);border:1px dashed var(--tur);border-radius:12px;}
.pano-y{flex:1;font-size:12px;font-weight:600;color:var(--tur);line-height:1.4;}
.pano-y b{font-weight:800;}
.tkv-tut::after{content:"";position:absolute;left:50%;bottom:2px;width:18px;height:2px;
  transform:translateX(-50%);border-radius:2px;
  background:color-mix(in srgb, var(--c) 55%, #fff);}

.gorev-panel{border-left:4px solid var(--c);}
.gp-baslik{min-width:0;}
.gp-ders{font-size:9.5px;font-weight:800;letter-spacing:.8px;color:var(--c);}
.gp-konu{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:3px;}
.gp-tarih{font-size:11.5px;font-weight:600;color:var(--sol);margin-top:4px;}
.birincil.bitti-b{background:var(--yes);}
.konu-sec-b.etkin{border-color:var(--tur);background:var(--tur-a);color:var(--tur);}
.konu-sec-b{display:flex;justify-content:space-between;align-items:center;gap:8px;}

.sbl{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 0;border-top:1px solid var(--cizgi);flex-wrap:wrap;}
.sbl:first-of-type{border-top:none;}
.sbl-ad{font-size:13.5px;font-weight:800;}
.sbl-alt{font-size:10.5px;font-weight:600;color:var(--sol);margin-top:2px;}
.sbl-d{display:flex;gap:5px;}

.sec-panel{margin-top:16px;padding:14px;background:var(--yzy2);
  border-radius:14px;}
.konu-sec{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;
  max-height:340px;overflow-y:auto;}
.konu-sec-b{text-align:left;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:10px;padding:11px 13px;color:var(--met);font-family:inherit;
  font-weight:700;font-size:13px;cursor:pointer;}
.konu-sec-b:hover{border-color:var(--tur);color:var(--tur);}

/* deneme */
.dn-basl{display:grid;grid-template-columns:1fr 66px 66px 54px;gap:8px;
  margin-top:16px;padding-bottom:8px;}
.dn-basl span{font-size:9px;font-weight:800;color:var(--sol);
  letter-spacing:.7px;text-align:center;}
.dn-basl span:first-child{text-align:left;}
.dn-satir{display:grid;grid-template-columns:1fr 66px 66px 54px;gap:8px;
  align-items:center;padding:5px 0;}
.dn-ad{font-size:13px;font-weight:800;}
.dn-ad i{font-style:normal;font-weight:600;color:var(--sol);font-size:10px;}
.dn-satir input{padding:9px;text-align:center;font-size:14px;}
.dn-net{font-size:13px;font-weight:900;text-align:center;color:var(--tur);
  font-variant-numeric:tabular-nums;}

.grafik{width:100%;height:120px;display:block;}
.grafik-alt{display:flex;justify-content:space-between;font-size:10px;
  font-weight:600;color:var(--sol);margin-top:6px;}
.minig{display:block;}
.mini-yok{font-size:11px;color:var(--sol);}
.dg-basl{display:grid;grid-template-columns:62px 1fr 48px 52px;gap:8px;
  padding-bottom:7px;}
.dg-basl span{font-size:9px;font-weight:800;letter-spacing:.7px;color:var(--sol);}
.dg-basl span:nth-child(3),.dg-basl span:nth-child(4){text-align:right;}
.dg-satir{display:grid;grid-template-columns:62px 1fr 48px 52px;gap:8px;
  align-items:center;padding:5px 0;border-top:1px solid var(--cizgi);}
.dg-ad{font-size:11.5px;font-weight:800;}
.dg-ad i{font-style:normal;font-weight:600;color:var(--sol);font-size:9px;}
.dg-son{font-size:13px;font-weight:900;text-align:right;
  font-variant-numeric:tabular-nums;}
.dg-fark{font-size:11.5px;font-weight:800;text-align:right;color:var(--sol);
  font-variant-numeric:tabular-nums;}
.dg-fark.arti{color:var(--yes);} .dg-fark.eksi{color:var(--kir);}
.hf-bar{display:flex;align-items:center;gap:10px;margin-top:12px;}
.hf-yol{flex:1;height:9px;background:var(--yzy2);border-radius:99px;overflow:hidden;}
.hf-dolu{height:100%;background:linear-gradient(90deg,var(--tur),var(--tur-p));
  border-radius:99px;}
.hf-oran{font-size:11px;font-weight:800;color:var(--sol);white-space:nowrap;}
.hf-alt{font-size:11px;font-weight:600;color:var(--sol);margin-top:7px;}
.hf-tablo{display:flex;flex-direction:column;margin-top:14px;
  border-top:1px solid var(--cizgi);padding-top:4px;}
.trend{font-size:13px;font-weight:800;margin-bottom:16px;}
.trend.artis{color:var(--yes);} .trend.dusus{color:var(--kir);}
.cubuklar{display:flex;flex-direction:column;gap:9px;}
.cubuk-satir{display:grid;grid-template-columns:44px 1fr 46px;gap:10px;align-items:center;}
.cubuk-ad{font-size:11px;font-weight:800;color:var(--sol);}
.cubuk-yol{height:8px;background:#E5EFF1;border-radius:99px;overflow:hidden;}
.cubuk-dolu{height:100%;background:linear-gradient(90deg,var(--tur),var(--tur-p));
  border-radius:99px;transition:width .5s;}
.cubuk-net{font-size:12px;font-weight:900;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--met);}
.oneri{margin-top:16px;padding:12px 14px;background:var(--tur-a);border-radius:12px;
  font-size:12.5px;font-weight:600;line-height:1.5;color:#3A6570;}
.oneri b{color:var(--tur);font-weight:800;}
.dnm{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
  border-top:1px solid var(--cizgi);}
.dnm-ad{font-size:14px;font-weight:800;}
.dnm-t{font-size:11px;font-weight:600;color:var(--sol);margin-top:2px;}
.dnm-sag{text-align:right;}
.dnm-net{font-size:19px;font-weight:900;color:var(--tur);font-variant-numeric:tabular-nums;}
.dnm-dilim{font-size:11px;font-weight:600;color:var(--sol);}

/* kitap */
.kitap-ad{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.kitap-bilgi{font-size:12px;font-weight:600;color:var(--sol);margin-top:5px;line-height:1.5;}
.ktp{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 0;border-top:1px solid var(--cizgi);}
.ktp-ad{font-size:14px;font-weight:800;}
.ktp-alt{font-size:11px;font-weight:600;color:var(--sol);margin-top:3px;}
.ktp-t{font-size:11px;font-weight:700;color:var(--tur);margin-top:4px;}

/* boş durum */
.bos{padding:26px 18px;text-align:center;}
.bos-b{font-size:14px;font-weight:800;margin-bottom:6px;}
.bos-m{font-size:12px;font-weight:600;color:var(--sol);line-height:1.5;}

/* logo & imza */
.logo{flex-shrink:0;display:block;border-radius:50%;object-fit:contain;}
.imza{display:flex;flex-direction:column;align-items:center;
  padding:28px 0 10px;text-align:center;}
.imza .logo{margin-bottom:15px;}
.imza-ad{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.45;
  color:var(--met);}
.imza-alt{font-size:12px;font-weight:500;letter-spacing:.2px;
  color:var(--sol);margin-top:12px;padding-top:12px;
  border-top:1px solid var(--cizgi);}

/* konu işaretleme */
.dnm-sag-sar{display:flex;align-items:center;gap:10px;}
.isaret-liste{display:flex;flex-direction:column;gap:5px;margin-top:12px;
  max-height:360px;overflow-y:auto;}
.isaret-satir{display:flex;align-items:center;gap:8px;}
.isaret-ad{flex:1;text-align:left;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:10px;padding:10px 12px;color:var(--met);font-family:inherit;
  font-weight:700;font-size:12.5px;cursor:pointer;}
.isaret-satir.dolu .isaret-ad{background:#FBE3E0;border-color:#EFBDB6;color:#A93A2D;}
.adet{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.adet button{width:28px;height:28px;border-radius:8px;background:var(--yzy2);
  border:none;color:var(--met);font-family:inherit;font-weight:900;
  font-size:15px;cursor:pointer;line-height:1;}
.adet span{min-width:22px;text-align:center;font-size:13px;font-weight:900;
  color:var(--kir);font-variant-numeric:tabular-nums;}

/* analiz */
.eksik{padding:13px 0;border-top:1px solid var(--cizgi);}
.eksik:first-of-type{border-top:none;padding-top:4px;}
.eksik-ust{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.eksik-sol{display:flex;align-items:baseline;gap:7px;min-width:0;}
.eksik-ders{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--tur);
  background:var(--tur-a);padding:3px 7px;border-radius:5px;flex-shrink:0;}
.eksik-ad{font-size:13.5px;font-weight:700;line-height:1.3;}
.eksik-adet{font-size:17px;font-weight:900;color:var(--kir);
  font-variant-numeric:tabular-nums;flex-shrink:0;}
.eksik-yol{height:6px;background:#EEF4F5;border-radius:99px;overflow:hidden;margin-top:8px;}
.eksik-dolu{height:100%;background:linear-gradient(90deg,#E4796C,#D9564A);
  border-radius:99px;transition:width .5s;}
.eksik-alt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;}
.teshis{font-size:9px;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:99px;}
.teshis.kritik{color:#A93A2D;background:#FBE3E0;}
.teshis.orta{color:#8A5C0B;background:#FBEED2;}
.eksik-not{font-size:10.5px;font-weight:600;color:var(--sol);}

.mesaj{margin-top:14px;padding:10px 13px;background:var(--tur-a);
  border-radius:11px;font-size:12px;font-weight:700;color:var(--tur);text-align:center;}

.tavsiye{padding:14px;border-radius:14px;margin-bottom:10px;}
.tavsiye:last-child{margin-bottom:0;}
.tavsiye.kritik{background:#FDEEEC;border:1px solid #F4CFC9;}
.tavsiye.orta{background:#FDF6E7;border:1px solid #F0E0BC;}
.tavsiye-b{font-size:13.5px;font-weight:800;line-height:1.35;color:var(--met);}
.tavsiye-l{font-size:11.5px;font-weight:600;color:var(--sol);
  margin-top:7px;line-height:1.5;}
.tavsiye-o{font-size:12px;font-weight:700;margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(0,0,0,.07);line-height:1.45;}
.tavsiye.kritik .tavsiye-o{color:#A93A2D;}
.tavsiye.orta .tavsiye-o{color:#8A5C0B;}

/* mesajlaşma */
.msj-dugme{position:relative;margin-left:auto;flex-shrink:0;width:36px;height:36px;
  border-radius:11px;background:var(--tur-a);border:none;cursor:pointer;
  display:grid;place-items:center;}
.msj-ikon{font-size:17px;color:var(--tur);line-height:1;}
.msj-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;
  border-radius:99px;background:var(--kir);color:#fff;font-size:10px;
  font-weight:900;display:grid;place-items:center;padding:0 5px;
  border:2px solid #fff;}
.ufak.vurgu{background:#FBE3E0;color:#A93A2D;}

.sohbet-kart{padding-bottom:14px;}
.sohbet{display:flex;flex-direction:column;gap:10px;}
.balon{max-width:82%;padding:10px 13px;border-radius:15px;}
.balon.benim{align-self:flex-end;background:var(--tur);color:#fff;
  border-bottom-right-radius:5px;}
.balon.karsi{align-self:flex-start;background:var(--yzy2);color:var(--met);
  border-bottom-left-radius:5px;}
.balon-kim{font-size:9.5px;font-weight:800;letter-spacing:.5px;
  color:var(--tur);margin-bottom:4px;}
.balon-metin{font-size:13.5px;font-weight:600;line-height:1.45;
  white-space:pre-wrap;word-break:break-word;}
.balon-saat{font-size:9.5px;font-weight:600;margin-top:5px;text-align:right;}
.balon.benim .balon-saat{color:rgba(255,255,255,.65);}
.balon.karsi .balon-saat{color:var(--sol);}

.hazir{display:flex;flex-direction:column;gap:6px;}
.hazir-b{text-align:left;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:11px;padding:10px 13px;color:var(--met);font-family:inherit;
  font-weight:600;font-size:12.5px;line-height:1.4;cursor:pointer;}
.hazir-b:hover{border-color:var(--tur);color:var(--tur);}

.yaz-cubugu{display:flex;gap:8px;align-items:flex-end;
  background:var(--yzy);border:1px solid var(--cizgi);border-radius:18px;
  padding:10px;box-shadow:var(--golge);}
.yaz{flex:1;background:var(--yzy2);border:1.5px solid transparent;border-radius:12px;
  padding:11px 12px;color:var(--met);font-family:inherit;font-weight:600;
  font-size:14px;outline:none;resize:none;line-height:1.4;}
.yaz:focus{border-color:var(--tur);background:#fff;}
.yaz::placeholder{color:#A8BEC3;}
.yaz-b{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--tur);
  border:none;color:#fff;font-size:16px;cursor:pointer;
  box-shadow:0 2px 8px rgba(6,120,140,.22);}
.yaz-b:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}

/* video */
.konu-satir{display:grid;grid-template-columns:1fr repeat(6,27px) 30px;gap:4px;
  align-items:center;padding:7px 0;border-top:1px solid var(--cizgi);}
.konu-basl{display:grid;grid-template-columns:1fr repeat(6,27px) 30px;gap:4px;
  padding-bottom:8px;}
.konu-ad{cursor:pointer;}
.vid-b{height:30px;border-radius:9px;background:var(--yzy2);
  border:1.5px solid transparent;color:#BACCD0;font-family:inherit;
  font-weight:900;font-size:11px;cursor:pointer;padding:0;}
.vid-b.dolu{background:#B8262A;color:#fff;}
.vid-b.genis{width:34px;height:34px;flex-shrink:0;font-size:12px;}
.vid-b:hover{border-color:var(--tur);}
.ufak.vid-ufak{background:#FBE6E6;color:#A93A2D;}

.konu-panel{padding:12px;background:var(--yzy2);border-radius:12px;margin:2px 0 8px;}
.vid-giris{width:100%;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:10px;padding:10px 12px;color:var(--met);font-family:inherit;
  font-weight:600;font-size:12.5px;outline:none;}
.vid-giris:focus{border-color:var(--tur);}
.konu-panel-d{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

.vid-perde{position:fixed;inset:0;z-index:60;background:rgba(10,30,36,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;}
.vid-kutu{width:100%;max-width:520px;background:#FFFFFF;border-radius:18px;
  padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);}
.vid-ust{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.vid-baslik{flex:1;font-size:14px;font-weight:800;line-height:1.3;color:var(--met);}
.vid-kapat{width:32px;height:32px;flex-shrink:0;border-radius:10px;
  background:var(--yzy2);border:none;color:var(--met);font-size:20px;
  line-height:1;cursor:pointer;font-family:inherit;}
.vid-cerceve{position:relative;width:100%;padding-top:56.25%;
  border-radius:12px;overflow:hidden;background:#000;}
.vid-cerceve iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vid-uyari{padding:22px 14px;background:var(--yzy2);border-radius:12px;
  font-size:12.5px;font-weight:600;color:var(--sol);line-height:1.5;text-align:center;}
.vid-dis{display:block;text-align:center;margin-top:11px;font-size:12px;
  font-weight:700;color:var(--tur);text-decoration:none;padding:9px;
  border:1px solid var(--cizgi);border-radius:10px;}


/* görüşme notları */
.not-yaz{background:#FFFFFF;border:1.5px solid var(--cizgi);border-radius:11px;
  padding:11px 12px;color:var(--met);font-family:inherit;font-weight:600;
  font-size:13.5px;width:100%;outline:none;resize:vertical;line-height:1.45;}
.not-yaz:focus{border-color:var(--tur);}
.onay{display:flex;align-items:center;gap:9px;width:100%;margin-top:12px;
  background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
  font-size:12.5px;font-weight:700;color:var(--sol);}
.onay-k{width:22px;height:22px;border-radius:7px;background:#FFFFFF;
  border:1.5px solid var(--cizgi);display:grid;place-items:center;
  font-size:13px;font-weight:900;color:#fff;flex-shrink:0;}
.onay.etkin{color:var(--tur);}
.onay.etkin .onay-k{background:var(--tur);border-color:var(--tur);}
.grs{padding:13px 0;border-top:1px solid var(--cizgi);}
.grs:first-of-type{border-top:none;padding-top:2px;}
.grs-ust{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.grs-t{font-size:12px;font-weight:800;color:var(--met);}
.grs-d{display:flex;gap:6px;align-items:center;}
.etiketcik{font-size:9px;font-weight:800;letter-spacing:.4px;padding:5px 9px;
  border-radius:99px;background:var(--yzy2);color:var(--sol);border:none;
  font-family:inherit;cursor:pointer;}
.etiketcik.acik{background:#DFF3EC;color:#0F7355;}
.grs-m{font-size:13px;font-weight:600;line-height:1.5;margin-top:8px;
  white-space:pre-wrap;}
.grs-h{font-size:12.5px;font-weight:700;line-height:1.5;margin-top:10px;
  padding:10px 12px;background:var(--tur-a);border-radius:10px;color:#3A6570;}
.grs-h-a{display:block;font-size:8.5px;font-weight:800;letter-spacing:1.2px;
  color:var(--tur);margin-bottom:4px;}

/* boş bırakma */
.bos-ust{display:flex;gap:14px;align-items:center;}
.bos-halka{flex-shrink:0;width:86px;height:86px;border-radius:50%;
  background:#FBEFEE;display:grid;place-items:center;text-align:center;}
.bos-oran{font-size:22px;font-weight:900;color:#B8493C;letter-spacing:-1px;}
.bos-a{font-size:9px;font-weight:700;color:#A96C63;margin-top:1px;}
.bos-yorum{font-size:12.5px;font-weight:600;line-height:1.5;color:var(--sol);}
.bos-sayi{font-size:11px;font-weight:700;color:var(--sol);margin-top:12px;
  text-align:center;}
.cubuk-dolu.bos-dolu{background:linear-gradient(90deg,#E9A199,#D9564A);}

/* yazdırma */
.baski{display:none;}
.cikti-d{display:flex;gap:8px;flex-wrap:wrap;}
.cikti-d .ikincil{flex:1;min-width:180px;text-align:center;}
