.konu-ad{font-size:12.5px;font-weight:600;line-height:1.3;}
.kutu{height:28px;border-radius:8px;font-size:11px;background:var(--yzy2);border:1.5px solid transparent;
  color:#fff;font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;}
.kutu.dolu{background:var(--tur);}
.kutu:hover{border-color:var(--tur);}
.konu-ekle{display:flex;gap:8px;margin-top:16px;}

/* özet görev satırı */
.gorev{display:flex;align-items:center;gap:12px;padding:11px 0;
  border-top:1px solid var(--cizgi);}
.gorev-kutu{width:32px;height:32px;flex-shrink:0;border-radius:10px;
  background:var(--yzy2);border:1.5px solid transparent;color:var(--sol);
  font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;}
.gorev-kutu.dolu{background:var(--yes);color:#fff;}
.gorev-yazi{flex:1;min-width:0;}
.gorev-ders{font-size:9.5px;font-weight:800;letter-spacing:.8px;color:var(--tur);}
.gorev-konu{font-size:13.5px;font-weight:700;margin-top:2px;line-height:1.3;}
.gorev.bitti .gorev-konu{text-decoration:line-through;color:var(--sol);}
.gorev.bitti .gorev-ders{opacity:.5;}
.gorev-vid{font-weight:700;color:var(--sol);letter-spacing:0;}

/* takvim */
.tk-ust-kart{padding:14px 16px;}
.tk-nav{display:flex;align-items:center;gap:10px;}
.tk-ok{width:34px;height:34px;flex-shrink:0;border-radius:11px;background:var(--yzy2);
  border:none;color:var(--tur);font-size:20px;line-height:1;cursor:pointer;
  font-family:inherit;font-weight:800;}
.tk-ok:hover{background:var(--tur-a);}
.tk-aralik{flex:1;text-align:center;min-width:0;}
.tk-aralik-b{font-size:14.5px;font-weight:800;letter-spacing:-.2px;}
.tk-aralik-a{font-size:10.5px;font-weight:700;color:var(--sol);margin-top:2px;}
.tk-arac{display:flex;justify-content:space-between;align-items:center;
  gap:8px;margin-top:12px;flex-wrap:wrap;}

/* görev penceresi */
.gd-perde{position:fixed;inset:0;z-index:60;background:rgba(10,30,36,.55);
  display:flex;align-items:center;justify-content:center;padding:14px;}
.gd{width:100%;max-width:420px;max-height:min(88vh, 660px);background:#fff;
  border-radius:18px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.3);}
.gd-ust{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;
  border-bottom:1px solid var(--cizgi);flex-shrink:0;}
.gd-ust.renkli{border-left:4px solid var(--c);}
.gd-a{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--sol);}
.gd-ust.renkli .gd-a{color:var(--c);}
.gd-k{font-size:15px;font-weight:800;letter-spacing:-.2px;margin-top:2px;}
.gd-b{font-size:11px;font-weight:700;color:var(--sol);margin-top:3px;}
.gd-govde{flex:1;overflow-y:auto;padding:12px 14px;}
.gd-e{font-size:8.5px;font-weight:800;letter-spacing:1.1px;color:var(--sol);
  margin:12px 0 6px;}
.gd-e:first-child{margin-top:0;}
.gd-ara{width:100%;background:var(--yzy2);border:1.5px solid transparent;
  border-radius:9px;padding:8px 10px;font-family:inherit;font-weight:600;
  font-size:12.5px;color:var(--met);outline:none;margin-bottom:6px;}
.gd-ara:focus{border-color:var(--tur);background:#fff;}
.gd-konular{display:flex;flex-direction:column;gap:3px;max-height:160px;
  overflow-y:auto;padding-right:2px;}
.gd-konu{display:flex;justify-content:space-between;align-items:center;gap:8px;
  text-align:left;background:var(--yzy2);border:1.5px solid transparent;
  border-radius:8px;padding:7px 10px;font-family:inherit;font-weight:700;
  font-size:12px;color:var(--met);cursor:pointer;}
.gd-konu i{font-style:normal;font-size:8px;font-weight:800;color:var(--tur);
  background:var(--tur-a);padding:2px 5px;border-radius:4px;flex-shrink:0;}
.gd-konu.etkin{background:var(--tur);color:#fff;border-color:var(--tur);}
.gd-konu.etkin i{background:rgba(255,255,255,.25);color:#fff;}
.gd-zaman{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.gd-zaman.uclu-z{grid-template-columns:1.3fr 1fr .8fr;}
.gd-zaman input{background:var(--yzy2);border:1.5px solid transparent;border-radius:9px;
  padding:8px 10px;font-family:inherit;font-weight:700;font-size:12.5px;
  color:var(--met);outline:none;width:100%;}
.gd-zaman input:focus{border-color:var(--tur);background:#fff;}
.gd-sure{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.gd-s{background:var(--yzy2);border:1.5px solid transparent;border-radius:99px;
  padding:6px 11px;font-family:inherit;font-weight:800;font-size:11px;
  color:var(--sol);cursor:pointer;}
.gd-s.etkin{background:var(--tur);color:#fff;}
.gd-onay{display:flex;align-items:center;gap:8px;width:100%;margin-top:14px;
  background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
  font-size:11.5px;font-weight:700;color:var(--sol);text-align:left;}
.gd-onay.etkin{color:var(--tur);}
.gd-onay .onay-k{width:20px;height:20px;border-radius:6px;background:#fff;
  border:1.5px solid var(--cizgi);}
.gd-onay.etkin .onay-k{background:var(--tur);border-color:var(--tur);}
.gd-d{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
.gd-alt{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-top:1px solid var(--cizgi);background:#FBFDFD;flex-shrink:0;}
.gd-secim{flex:1;font-size:11.5px;font-weight:700;color:var(--met);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gd-kaydet{margin:0;width:auto;padding:11px 22px;flex-shrink:0;}

/* takvim ızgarası */
.tkv{overflow:auto;-webkit-overflow-scrolling:touch;
  max-height:min(560px, calc(100vh - 300px));
  background:var(--yzy);border:1px solid var(--cizgi);border-radius:16px;
  box-shadow:var(--golge);}
.tkv-tablo{display:grid;grid-template-columns:52px repeat(var(--gun), minmax(104px,1fr));
  min-width:100%;position:relative;touch-action:pan-y;}

.tkv-kose{position:sticky;left:0;top:0;z-index:6;background:var(--yzy);
  border-right:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi);}
.tkv-tg-a{display:flex;align-items:center;justify-content:center;font-size:8px;
  font-weight:800;letter-spacing:.6px;color:var(--sol);}
.tkv-baslik{display:flex;flex-direction:column;align-items:center;gap:0;
  padding:6px 2px;border-bottom:1px solid var(--cizgi);
  border-left:1px solid var(--cizgi);background:var(--yzy);
  position:sticky;top:0;z-index:3;}
.tkv-b-ad{font-size:9px;font-weight:800;letter-spacing:.8px;color:var(--sol);}
.tkv-b-t{font-size:14px;font-weight:900;color:var(--met);line-height:1.1;}
.tkv-baslik.bugun{background:var(--tur-a);}
.tkv-baslik.bugun .tkv-b-t,.tkv-baslik.bugun .tkv-b-ad{color:var(--tur);}

.tkv-tumgun{min-height:24px;padding:2px;display:flex;flex-direction:column;gap:3px;
  border-left:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi);
  background:#FBFDFD;}
.tkv-mini{text-align:left;line-height:1.2;
  background:color-mix(in srgb, var(--c) 16%, #fff);border:1px dashed var(--c);
  border-left:3px solid var(--c);border-radius:6px;padding:3px 5px;
  font-family:inherit;font-size:8.5px;font-weight:700;color:var(--met);
  cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tkv-mini b{color:var(--c);margin-right:3px;}
.tkv-mini.bitti{opacity:.45;text-decoration:line-through;}

.tkv-saatler{position:sticky;left:0;z-index:2;background:var(--yzy);
  border-right:1px solid var(--cizgi);}
.tkv-saat{font-size:9px;font-weight:800;color:var(--sol);text-align:right;
  padding:2px 6px 0 0;font-variant-numeric:tabular-nums;
  border-top:1px solid var(--cizgi);}
.tkv-saat:first-child{border-top:none;}

.tkv-sutun{position:relative;border-left:1px solid var(--cizgi);cursor:pointer;
  background:repeating-linear-gradient(to bottom,
    var(--cizgi) 0, var(--cizgi) 1px,
    transparent 1px, transparent var(--h));}
.tkv-sutun.bugun{background-color:rgba(6,120,140,.035);}
.tkv-simdi{position:absolute;left:0;right:0;height:2px;background:#D9534F;z-index:5;}
.tkv-simdi::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;
  border-radius:50%;background:#D9534F;}

.tkv-blok{position:absolute;z-index:3;border-radius:6px;overflow:hidden;
  background:color-mix(in srgb, var(--c) 30%, #fff);
  border:1px solid color-mix(in srgb, var(--c) 62%, #fff);
  border-left:3px solid var(--c);
  padding:2px 4px 2px 5px;cursor:grab;touch-action:none;
  display:flex;flex-direction:column;gap:1px;}
.tkv-blok.tekrar{background:color-mix(in srgb, var(--c) 12%, #fff);
  border-style:dashed;border-left-style:solid;}
.tkv-blok.deneme{background:color-mix(in srgb, var(--c) 88%, #fff);border-width:0;}
.tkv-blok.etkinlik{background:color-mix(in srgb, var(--c) 24%, #fff);
  border-style:solid;border-color:color-mix(in srgb, var(--c) 55%, #fff);}
.tkv-blok.deneme .tkv-blok-s,.tkv-blok.deneme .tkv-blok-k,
.tkv-blok.deneme .tkv-blok-k b{color:#fff;}
.tkv-blok.bitti{opacity:.5;}
.tkv-blok.bitti .tkv-blok-k{text-decoration:line-through;}
.tkv-blok.suruklenen{z-index:10;cursor:grabbing;opacity:.9;
  box-shadow:0 6px 18px rgba(18,48,58,.22);}
.tkv-blok-s{font-size:8px;font-weight:900;
  color:color-mix(in srgb, var(--c) 78%, #000);
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.tkv-blok-k{font-size:9.5px;font-weight:700;color:var(--met);line-height:1.2;
  overflow:hidden;}
.tkv-blok-k b{color:color-mix(in srgb, var(--c) 75%, #000);}
.tkv-tut{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;
  touch-action:none;}
.tkv-tut::after{content:"";position:absolute;left:50%;bottom:2px;width:18px;height:2px;
  transform:translateX(-50%);border-radius:2px;
  background:color-mix(in srgb, var(--c) 55%, #fff);}

.gorev-panel{border-left:4px solid var(--c);}
.gp-baslik{min-width:0;}
.gp-ders{font-size:9.5px;font-weight:800;letter-spacing:.8px;color:var(--c);}
.gp-konu{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:3px;}
.gp-tarih{font-size:11.5px;font-weight:600;color:var(--sol);margin-top:4px;}
.birincil.bitti-b{background:var(--yes);}
.konu-sec-b.etkin{border-color:var(--tur);background:var(--tur-a);color:var(--tur);}
.konu-sec-b{display:flex;justify-content:space-between;align-items:center;gap:8px;}

.sbl{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 0;border-top:1px solid var(--cizgi);flex-wrap:wrap;}
.sbl:first-of-type{border-top:none;}
.sbl-ad{font-size:13.5px;font-weight:800;}
.sbl-alt{font-size:10.5px;font-weight:600;color:var(--sol);margin-top:2px;}
.sbl-d{display:flex;gap:5px;}

.sec-panel{margin-top:16px;padding:14px;background:var(--yzy2);
  border-radius:14px;}
.konu-sec{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;
  max-height:340px;overflow-y:auto;}
.konu-sec-b{text-align:left;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:10px;padding:11px 13px;color:var(--met);font-family:inherit;
  font-weight:700;font-size:13px;cursor:pointer;}
.konu-sec-b:hover{border-color:var(--tur);color:var(--tur);}

/* deneme */
.dn-basl{display:grid;grid-template-columns:1fr 66px 66px 54px;gap:8px;
  margin-top:16px;padding-bottom:8px;}
.dn-basl span{font-size:9px;font-weight:800;color:var(--sol);
  letter-spacing:.7px;text-align:center;}
.dn-basl span:first-child{text-align:left;}
.dn-satir{display:grid;grid-template-columns:1fr 66px 66px 54px;gap:8px;
  align-items:center;padding:5px 0;}
.dn-ad{font-size:13px;font-weight:800;}
.dn-ad i{font-style:normal;font-weight:600;color:var(--sol);font-size:10px;}
.dn-satir input{padding:9px;text-align:center;font-size:14px;}
.dn-net{font-size:13px;font-weight:900;text-align:center;color:var(--tur);
  font-variant-numeric:tabular-nums;}

.grafik{width:100%;height:120px;display:block;}
.grafik-alt{display:flex;justify-content:space-between;font-size:10px;
  font-weight:600;color:var(--sol);margin-top:6px;}
.trend{font-size:13px;font-weight:800;margin-bottom:16px;}
.trend.artis{color:var(--yes);} .trend.dusus{color:var(--kir);}
.cubuklar{display:flex;flex-direction:column;gap:9px;}
.cubuk-satir{display:grid;grid-template-columns:44px 1fr 46px;gap:10px;align-items:center;}
.cubuk-ad{font-size:11px;font-weight:800;color:var(--sol);}
.cubuk-yol{height:8px;background:#E5EFF1;border-radius:99px;overflow:hidden;}
.cubuk-dolu{height:100%;background:linear-gradient(90deg,var(--tur),var(--tur-p));
  border-radius:99px;transition:width .5s;}
.cubuk-net{font-size:12px;font-weight:900;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--met);}
.oneri{margin-top:16px;padding:12px 14px;background:var(--tur-a);border-radius:12px;
  font-size:12.5px;font-weight:600;line-height:1.5;color:#3A6570;}
.oneri b{color:var(--tur);font-weight:800;}
.dnm{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
  border-top:1px solid var(--cizgi);}
.dnm-ad{font-size:14px;font-weight:800;}
.dnm-t{font-size:11px;font-weight:600;color:var(--sol);margin-top:2px;}
.dnm-sag{text-align:right;}
.dnm-net{font-size:19px;font-weight:900;color:var(--tur);font-variant-numeric:tabular-nums;}
.dnm-dilim{font-size:11px;font-weight:600;color:var(--sol);}

/* kitap */
.kitap-ad{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.kitap-bilgi{font-size:12px;font-weight:600;color:var(--sol);margin-top:5px;line-height:1.5;}
.ktp{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 0;border-top:1px solid var(--cizgi);}
.ktp-ad{font-size:14px;font-weight:800;}
.ktp-alt{font-size:11px;font-weight:600;color:var(--sol);margin-top:3px;}
.ktp-t{font-size:11px;font-weight:700;color:var(--tur);margin-top:4px;}

/* boş durum */
.bos{padding:26px 18px;text-align:center;}
.bos-b{font-size:14px;font-weight:800;margin-bottom:6px;}
.bos-m{font-size:12px;font-weight:600;color:var(--sol);line-height:1.5;}

/* logo & imza */
.logo{flex-shrink:0;display:block;border-radius:50%;object-fit:contain;}
.imza{display:flex;flex-direction:column;align-items:center;
  padding:28px 0 10px;text-align:center;}
.imza .logo{margin-bottom:15px;}
.imza-ad{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.45;
  color:var(--met);}
.imza-alt{font-size:12px;font-weight:500;letter-spacing:.2px;
  color:var(--sol);margin-top:12px;padding-top:12px;
  border-top:1px solid var(--cizgi);}

/* konu işaretleme */
.dnm-sag-sar{display:flex;align-items:center;gap:10px;}
.isaret-liste{display:flex;flex-direction:column;gap:5px;margin-top:12px;
  max-height:360px;overflow-y:auto;}
.isaret-satir{display:flex;align-items:center;gap:8px;}
.isaret-ad{flex:1;text-align:left;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:10px;padding:10px 12px;color:var(--met);font-family:inherit;
  font-weight:700;font-size:12.5px;cursor:pointer;}
.isaret-satir.dolu .isaret-ad{background:#FBE3E0;border-color:#EFBDB6;color:#A93A2D;}
.adet{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.adet button{width:28px;height:28px;border-radius:8px;background:var(--yzy2);
  border:none;color:var(--met);font-family:inherit;font-weight:900;
  font-size:15px;cursor:pointer;line-height:1;}
.adet span{min-width:22px;text-align:center;font-size:13px;font-weight:900;
  color:var(--kir);font-variant-numeric:tabular-nums;}

/* analiz */
.eksik{padding:13px 0;border-top:1px solid var(--cizgi);}
.eksik:first-of-type{border-top:none;padding-top:4px;}
.eksik-ust{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.eksik-sol{display:flex;align-items:baseline;gap:7px;min-width:0;}
.eksik-ders{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--tur);
  background:var(--tur-a);padding:3px 7px;border-radius:5px;flex-shrink:0;}
.eksik-ad{font-size:13.5px;font-weight:700;line-height:1.3;}
.eksik-adet{font-size:17px;font-weight:900;color:var(--kir);
  font-variant-numeric:tabular-nums;flex-shrink:0;}
.eksik-yol{height:6px;background:#EEF4F5;border-radius:99px;overflow:hidden;margin-top:8px;}
.eksik-dolu{height:100%;background:linear-gradient(90deg,#E4796C,#D9564A);
  border-radius:99px;transition:width .5s;}
.eksik-alt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;}
.teshis{font-size:9px;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:99px;}
.teshis.kritik{color:#A93A2D;background:#FBE3E0;}
.teshis.orta{color:#8A5C0B;background:#FBEED2;}
.eksik-not{font-size:10.5px;font-weight:600;color:var(--sol);}

.mesaj{margin-top:14px;padding:10px 13px;background:var(--tur-a);
  border-radius:11px;font-size:12px;font-weight:700;color:var(--tur);text-align:center;}

.tavsiye{padding:14px;border-radius:14px;margin-bottom:10px;}
.tavsiye:last-child{margin-bottom:0;}
.tavsiye.kritik{background:#FDEEEC;border:1px solid #F4CFC9;}
.tavsiye.orta{background:#FDF6E7;border:1px solid #F0E0BC;}
.tavsiye-b{font-size:13.5px;font-weight:800;line-height:1.35;color:var(--met);}
.tavsiye-l{font-size:11.5px;font-weight:600;color:var(--sol);
  margin-top:7px;line-height:1.5;}
.tavsiye-o{font-size:12px;font-weight:700;margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(0,0,0,.07);line-height:1.45;}
.tavsiye.kritik .tavsiye-o{color:#A93A2D;}
.tavsiye.orta .tavsiye-o{color:#8A5C0B;}

/* mesajlaşma */
.msj-dugme{position:relative;margin-left:auto;flex-shrink:0;width:36px;height:36px;
  border-radius:11px;background:var(--tur-a);border:none;cursor:pointer;
  display:grid;place-items:center;}
.msj-ikon{font-size:17px;color:var(--tur);line-height:1;}
.msj-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;
  border-radius:99px;background:var(--kir);color:#fff;font-size:10px;
  font-weight:900;display:grid;place-items:center;padding:0 5px;
  border:2px solid #fff;}
.ufak.vurgu{background:#FBE3E0;color:#A93A2D;}

.sohbet-kart{padding-bottom:14px;}
.sohbet{display:flex;flex-direction:column;gap:10px;}
.balon{max-width:82%;padding:10px 13px;border-radius:15px;}
.balon.benim{align-self:flex-end;background:var(--tur);color:#fff;
  border-bottom-right-radius:5px;}
.balon.karsi{align-self:flex-start;background:var(--yzy2);color:var(--met);
  border-bottom-left-radius:5px;}
.balon-kim{font-size:9.5px;font-weight:800;letter-spacing:.5px;
  color:var(--tur);margin-bottom:4px;}
.balon-metin{font-size:13.5px;font-weight:600;line-height:1.45;
  white-space:pre-wrap;word-break:break-word;}
.balon-saat{font-size:9.5px;font-weight:600;margin-top:5px;text-align:right;}
.balon.benim .balon-saat{color:rgba(255,255,255,.65);}
.balon.karsi .balon-saat{color:var(--sol);}

.hazir{display:flex;flex-direction:column;gap:6px;}
.hazir-b{text-align:left;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:11px;padding:10px 13px;color:var(--met);font-family:inherit;
  font-weight:600;font-size:12.5px;line-height:1.4;cursor:pointer;}
.hazir-b:hover{border-color:var(--tur);color:var(--tur);}

.yaz-cubugu{display:flex;gap:8px;align-items:flex-end;
  background:var(--yzy);border:1px solid var(--cizgi);border-radius:18px;
  padding:10px;box-shadow:var(--golge);}
.yaz{flex:1;background:var(--yzy2);border:1.5px solid transparent;border-radius:12px;
  padding:11px 12px;color:var(--met);font-family:inherit;font-weight:600;
  font-size:14px;outline:none;resize:none;line-height:1.4;}
.yaz:focus{border-color:var(--tur);background:#fff;}
.yaz::placeholder{color:#A8BEC3;}
.yaz-b{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--tur);
  border:none;color:#fff;font-size:16px;cursor:pointer;
  box-shadow:0 2px 8px rgba(6,120,140,.22);}
.yaz-b:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}

/* video */
.konu-satir{display:grid;grid-template-columns:1fr repeat(6,27px) 30px;gap:4px;
  align-items:center;padding:7px 0;border-top:1px solid var(--cizgi);}
.konu-basl{display:grid;grid-template-columns:1fr repeat(6,27px) 30px;gap:4px;
  padding-bottom:8px;}
.konu-ad{cursor:pointer;}
.vid-b{height:30px;border-radius:9px;background:var(--yzy2);
  border:1.5px solid transparent;color:#BACCD0;font-family:inherit;
  font-weight:900;font-size:11px;cursor:pointer;padding:0;}
.vid-b.dolu{background:#B8262A;color:#fff;}
.vid-b.genis{width:34px;height:34px;flex-shrink:0;font-size:12px;}
.vid-b:hover{border-color:var(--tur);}
.ufak.vid-ufak{background:#FBE6E6;color:#A93A2D;}

.konu-panel{padding:12px;background:var(--yzy2);border-radius:12px;margin:2px 0 8px;}
.vid-giris{width:100%;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:10px;padding:10px 12px;color:var(--met);font-family:inherit;
  font-weight:600;font-size:12.5px;outline:none;}
.vid-giris:focus{border-color:var(--tur);}
.konu-panel-d{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

.vid-perde{position:fixed;inset:0;z-index:60;background:rgba(10,30,36,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;}
.vid-kutu{width:100%;max-width:520px;background:#FFFFFF;border-radius:18px;
  padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);}
.vid-ust{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.vid-baslik{flex:1;font-size:14px;font-weight:800;line-height:1.3;color:var(--met);}
.vid-kapat{width:32px;height:32px;flex-shrink:0;border-radius:10px;
  background:var(--yzy2);border:none;color:var(--met);font-size:20px;
  line-height:1;cursor:pointer;font-family:inherit;}
.vid-cerceve{position:relative;width:100%;padding-top:56.25%;
  border-radius:12px;overflow:hidden;background:#000;}
.vid-cerceve iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vid-uyari{padding:22px 14px;background:var(--yzy2);border-radius:12px;
  font-size:12.5px;font-weight:600;color:var(--sol);line-height:1.5;text-align:center;}
.vid-dis{display:block;text-align:center;margin-top:11px;font-size:12px;
  font-weight:700;color:var(--tur);text-decoration:none;padding:9px;
  border:1px solid var(--cizgi);border-radius:10px;}


/* görüşme notları */
.not-yaz{background:#FFFFFF;border:1.5px solid var(--cizgi);border-radius:11px;
  padding:11px 12px;color:var(--met);font-family:inherit;font-weight:600;
  font-size:13.5px;width:100%;outline:none;resize:vertical;line-height:1.45;}
.not-yaz:focus{border-color:var(--tur);}
.onay{display:flex;align-items:center;gap:9px;width:100%;margin-top:12px;
  background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
  font-size:12.5px;font-weight:700;color:var(--sol);}
.onay-k{width:22px;height:22px;border-radius:7px;background:#FFFFFF;
  border:1.5px solid var(--cizgi);display:grid;place-items:center;
  font-size:13px;font-weight:900;color:#fff;flex-shrink:0;}
.onay.etkin{color:var(--tur);}
.onay.etkin .onay-k{background:var(--tur);border-color:var(--tur);}
.grs{padding:13px 0;border-top:1px solid var(--cizgi);}
.grs:first-of-type{border-top:none;padding-top:2px;}
.grs-ust{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.grs-t{font-size:12px;font-weight:800;color:var(--met);}
.grs-d{display:flex;gap:6px;align-items:center;}
.etiketcik{font-size:9px;font-weight:800;letter-spacing:.4px;padding:5px 9px;
  border-radius:99px;background:var(--yzy2);color:var(--sol);border:none;
  font-family:inherit;cursor:pointer;}
.etiketcik.acik{background:#DFF3EC;color:#0F7355;}
.grs-m{font-size:13px;font-weight:600;line-height:1.5;margin-top:8px;
  white-space:pre-wrap;}
.grs-h{font-size:12.5px;font-weight:700;line-height:1.5;margin-top:10px;
  padding:10px 12px;background:var(--tur-a);border-radius:10px;color:#3A6570;}
.grs-h-a{display:block;font-size:8.5px;font-weight:800;letter-spacing:1.2px;
  color:var(--tur);margin-bottom:4px;}

/* boş bırakma */
.bos-ust{display:flex;gap:14px;align-items:center;}
.bos-halka{flex-shrink:0;width:86px;height:86px;border-radius:50%;
  background:#FBEFEE;display:grid;place-items:center;text-align:center;}
.bos-oran{font-size:22px;font-weight:900;color:#B8493C;letter-spacing:-1px;}
.bos-a{font-size:9px;font-weight:700;color:#A96C63;margin-top:1px;}
.bos-yorum{font-size:12.5px;font-weight:600;line-height:1.5;color:var(--sol);}
.bos-sayi{font-size:11px;font-weight:700;color:var(--sol);margin-top:12px;
  text-align:center;}
.cubuk-dolu.bos-dolu{background:linear-gradient(90deg,#E9A199,#D9564A);}

/* yazdırma */
.baski{display:none;}
.cikti-d{display:flex;gap:8px;flex-wrap:wrap;}
.cikti-d .ikincil{flex:1;min-width:180px;text-align:center;}
