.demo-d{display:flex;gap:4px;}
.demo-b{background:#FFFFFF;border:1px solid var(--cizgi);color:var(--sol);
  font-family:inherit;font-weight:800;font-size:10px;padding:6px 12px;
  border-radius:99px;cursor:pointer;}
.demo-b.etkin{background:var(--tur);color:#fff;border-color:var(--tur);}

.uyari{margin:12px 16px 0;padding:11px 14px;background:#FFF6E4;
  border:1px solid #F0DCB4;border-radius:12px;font-size:12px;
  font-weight:600;color:#8A6212;}

.govde{padding:16px;display:flex;flex-direction:column;gap:14px;}

/* kart */
.kart{background:var(--yzy);border:1px solid var(--cizgi);border-radius:20px;
  padding:18px;box-shadow:var(--golge);}
.kart.merkez{display:flex;flex-direction:column;align-items:center;gap:14px;
  background:linear-gradient(160deg,#FFFFFF 0%,#EFF8FA 100%);}
.kart-ust{display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:14px;}
.etiket{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--sol);margin-bottom:14px;}
.kart-ust .etiket,.merkez .etiket{margin-bottom:0;}
.link{background:none;border:none;color:var(--tur);font-family:inherit;
  font-weight:700;font-size:12px;cursor:pointer;padding:0;}
.sayac{font-size:11px;font-weight:700;color:var(--sol);white-space:nowrap;}
.satir-arasi{display:flex;justify-content:space-between;align-items:center;gap:10px;}

/* halka */
.halka-sar{position:relative;display:grid;place-items:center;}
.halka-ic{position:absolute;text-align:center;}
.halka-sayi{font-size:36px;font-weight:900;letter-spacing:-1.5px;line-height:1;color:var(--met);}
.halka-alt{font-size:11px;font-weight:600;color:var(--sol);margin-top:4px;}
.oran-yazi{font-size:13px;font-weight:600;color:var(--sol);}
.oran-yazi b{color:var(--tur);font-weight:800;}

/* mini istatistik */
.dortlu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.dortlu.ikili{grid-template-columns:repeat(2,1fr);}
.mini{background:var(--yzy);border:1px solid var(--cizgi);border-radius:14px;
  padding:13px 6px;text-align:center;box-shadow:var(--golge);}
.mini.duz{background:var(--yzy2);border-color:transparent;box-shadow:none;}
.mini-s{font-size:19px;font-weight:900;letter-spacing:-.5px;color:var(--met);}
.mini-a{font-size:9px;font-weight:700;color:var(--sol);letter-spacing:.3px;margin-top:3px;}

/* hedefler */
.hedef-sar{display:flex;flex-direction:column;gap:14px;}
.hedef-a{font-size:11px;font-weight:600;color:var(--sol);margin-bottom:4px;}
.hedef-d{font-size:16px;font-weight:800;letter-spacing:-.3px;}
.hedef-d.buyuk{font-size:24px;color:var(--tur);}

/* hedef okul kartı */
.hk{position:relative;height:158px;border-radius:16px;overflow:hidden;
  background:linear-gradient(135deg,#0B8299 0%,#055C6D 100%);}
.hk-gorsel{position:absolute;left:-46px;top:-6px;bottom:-6px;width:calc(50% + 46px);
  transform:skewX(-12deg);overflow:hidden;
  border-right:5px solid #FFFFFF;box-shadow:6px 0 18px rgba(3,45,54,.28);}
.hk-gorsel img{position:absolute;left:-28%;top:0;width:156%;height:100%;
  object-fit:cover;transform:skewX(12deg);}
.hk-mono{position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(150deg,#25B0C6 0%,#0A7A8E 55%,#065266 100%);}
.hk-mono::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.22),transparent 60%);}
.hk-mono span{position:relative;transform:skewX(12deg);color:#fff;
  font-size:38px;font-weight:900;letter-spacing:1px;
  text-shadow:0 2px 10px rgba(0,0,0,.18);}
.hk-bilgi{position:absolute;right:0;top:0;bottom:0;left:52%;
  padding:16px 16px 16px 10px;display:flex;flex-direction:column;
  justify-content:center;gap:7px;}
.hk-etiket{font-size:8.5px;font-weight:800;letter-spacing:1.4px;
  color:rgba(255,255,255,.65);}
.hk-ad{font-size:16px;font-weight:800;line-height:1.25;color:#fff;
  letter-spacing:-.3px;}
.hk-rozet{display:inline-flex;align-items:baseline;gap:6px;align-self:flex-start;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);
  border-radius:99px;padding:5px 11px;margin-top:2px;}
.hk-r-s{font-size:15px;font-weight:900;color:#fff;letter-spacing:-.3px;
  font-variant-numeric:tabular-nums;}
.hk-r-a{font-size:9px;font-weight:700;color:rgba(255,255,255,.7);}

/* öğrenci kartı */
.ogr-kart{background:var(--yzy);border:1px solid var(--cizgi);
  border-radius:18px;padding:16px;box-shadow:var(--golge);}
.ogr-ust{display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;cursor:pointer;}
.ogr-ad{font-size:16px;font-weight:800;letter-spacing:-.3px;}
.ogr-alt{font-size:11px;font-weight:600;color:var(--sol);margin-top:3px;}
.rozet{font-size:9px;font-weight:800;letter-spacing:.5px;padding:5px 10px;
  border-radius:99px;white-space:nowrap;flex-shrink:0;}
.rozet.iyi{color:#0F7355;background:#DFF3EC;}
.rozet.orta{color:#8A5C0B;background:#FBEED2;}
.rozet.kritik{color:#A93A2D;background:#FBE3E0;}
.seviye-rozet-sar{margin-top:9px;}
.seviye-rozet{font-size:9px;font-weight:800;letter-spacing:1px;padding:4px 9px;
  border-radius:6px;background:var(--yzy2);color:var(--sol);}
.seviye-rozet.yks{color:var(--tur);background:var(--tur-a);}
.ogr-bar{display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer;}
.ogr-yol{flex:1;height:8px;background:#E5EFF1;border-radius:99px;overflow:hidden;}
.ogr-dolu{height:100%;background:linear-gradient(90deg,var(--tur),var(--tur-p));
  border-radius:99px;transition:width .5s;}
.ogr-oran{font-size:11px;font-weight:700;color:var(--sol);white-space:nowrap;}
.ogr-oran b{color:var(--met);font-size:13px;font-weight:900;}
.ogr-alt-satir{display:flex;justify-content:space-between;margin-top:11px;
  font-size:11px;font-weight:600;color:var(--sol);}
.ogr-alt-satir b{color:var(--met);font-weight:800;}
.ogr-dugmeler{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;}
.ufak{background:var(--yzy2);border:1px solid transparent;border-radius:9px;
  padding:8px 12px;color:var(--tur);font-family:inherit;font-weight:700;
  font-size:11px;cursor:pointer;}
.ufak:hover{border-color:var(--tur);}
.ufak.tehlike{color:var(--kir);}

.kutucuk{margin-top:14px;padding:14px;background:var(--yzy2);
  border-radius:14px;}
.kutucuk-a{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--sol);
  margin-bottom:8px;}
.link-metin{font-size:13px;font-weight:700;color:var(--tur);
  word-break:break-all;margin-bottom:14px;}
.rapor{width:100%;background:#FFFFFF;border:1px solid var(--cizgi);border-radius:11px;
  padding:12px;color:var(--met);font-family:'Montserrat',sans-serif;font-size:11.5px;
  font-weight:600;line-height:1.65;resize:vertical;outline:none;}
.ikincil.tam{width:100%;margin-top:10px;}

/* seviye seçimi */
.secim-ikili{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.secim{background:var(--yzy2);border:1.5px solid transparent;border-radius:13px;
  padding:13px 10px;cursor:pointer;font-family:inherit;display:flex;
  flex-direction:column;gap:3px;align-items:center;}
.secim.etkin{background:var(--tur);border-color:var(--tur);}
.secim-ad{font-size:15px;font-weight:900;letter-spacing:.4px;color:var(--met);}
.secim.etkin .secim-ad{color:#fff;}
.secim-alt{font-size:9.5px;font-weight:700;color:var(--sol);}
.secim.etkin .secim-alt{color:rgba(255,255,255,.8);}

/* form */
.form{display:flex;flex-direction:column;gap:11px;}
.uclu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.ikili-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.alan{display:flex;flex-direction:column;gap:5px;}
.alan span{font-size:10px;font-weight:700;color:var(--sol);letter-spacing:.5px;}
.alan input,.konu-ekle input,.dn-satir input{
  background:var(--yzy2);border:1.5px solid transparent;border-radius:11px;
  padding:11px 12px;color:var(--met);font-family:inherit;font-weight:700;
  font-size:15px;width:100%;outline:none;}
.alan input:focus,.konu-ekle input:focus,.dn-satir input:focus{
  border-color:var(--tur);background:#fff;}
.alan input::placeholder{color:#A8BEC3;font-weight:600;}

/* net tabelası */
.net-tabela{display:flex;gap:10px;margin:16px 0 4px;}
.net-yan{background:var(--yzy2);border-radius:14px;padding:12px 16px;
  display:flex;flex-direction:column;justify-content:center;min-width:74px;}
.net-yan-a{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--sol);}
.net-yan-s{font-size:22px;font-weight:900;margin-top:2px;color:var(--met);}
.net-orta{flex:1;background:linear-gradient(135deg,#0B8399,#06788C);
  border-radius:14px;padding:12px 18px;
  display:flex;flex-direction:column;justify-content:center;}
.net-a{font-size:9px;font-weight:800;letter-spacing:1.6px;color:rgba(255,255,255,.75);}
.net-s{font-size:36px;font-weight:900;letter-spacing:-2px;line-height:1.05;
  color:#fff;font-variant-numeric:tabular-nums;}

.hata{margin-top:12px;padding:10px 13px;background:#FBE3E0;
  border:1px solid #F2C4BE;border-radius:11px;
  font-size:12px;font-weight:600;color:#A93A2D;}
.ipuc{font-size:10px;font-weight:600;color:var(--sol);opacity:.85;
  margin-top:10px;text-align:center;}

/* düğmeler */
.birincil{width:100%;margin-top:14px;background:var(--tur);border:none;
  border-radius:13px;padding:14px;color:#fff;font-family:inherit;
  font-weight:800;font-size:14px;letter-spacing:.2px;cursor:pointer;
  box-shadow:0 2px 8px rgba(6,120,140,.22);}
.birincil:hover{background:#056A7C;}
.birincil:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.birincil.genis{margin-top:0;}
.ikincil{background:#FFFFFF;border:1px solid var(--cizgi);border-radius:10px;
  padding:9px 14px;color:var(--tur);font-family:inherit;font-weight:700;
  font-size:12px;cursor:pointer;white-space:nowrap;}
.ikincil:hover{border-color:var(--tur);}

/* çipler */
.cipler{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.cipler.yapisik{margin-bottom:0;}
.cip{background:#FFFFFF;border:1.5px solid var(--cizgi);border-radius:99px;
  padding:9px 14px;color:var(--sol);font-family:inherit;font-weight:800;
  font-size:11px;letter-spacing:.4px;cursor:pointer;white-space:nowrap;}
.cip.etkin{background:var(--tur);color:#fff;border-color:var(--tur);}

.cip-serit{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:center;}
.cip-serit::-webkit-scrollbar{display:none;}
.serit-ayrac{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:1px;
  color:var(--tur);padding:0 8px 0 4px;border-left:1px solid var(--cizgi);
  margin-left:2px;align-self:stretch;display:flex;align-items:center;}

/* soru tablosu */
.gun-ust{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.gun-t{font-weight:800;font-size:14px;}
.gun-o{font-size:11px;font-weight:700;color:var(--tur);}
.tablo{display:flex;flex-direction:column;}
.tr{display:grid;grid-template-columns:1fr 26px 26px 26px 26px 46px;gap:4px;
  padding:9px 0;border-top:1px solid var(--cizgi);
  font-size:12px;font-weight:700;align-items:center;text-align:center;}
.tr.basl{border-top:none;font-size:9px;font-weight:800;color:var(--sol);
  letter-spacing:.7px;padding-bottom:6px;}
.hucre-konu{text-align:left;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.hucre-konu b{color:var(--tur);font-weight:800;margin-right:5px;}
.ye{color:var(--yes);} .kr{color:var(--kir);} .gr{color:var(--sol);}
.net-h{font-weight:900;font-variant-numeric:tabular-nums;color:var(--met);}

/* konu takibi */

.konu-basl-h{font-size:8px;font-weight:800;color:var(--sol);
  letter-spacing:.4px;text-align:center;}

.konu-ad{font-size:12.5px;font-weight:600;line-height:1.3;}
.kutu{height:30px;border-radius:9px;background:var(--yzy2);border:1.5px solid transparent;
  color:#fff;font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;}
.kutu.dolu{background:var(--tur);}
.kutu:hover{border-color:var(--tur);}
.konu-ekle{display:flex;gap:8px;margin-top:16px;}

/* haftalık program */
.gun-cipler{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.gun-cip{background:var(--yzy2);border:1.5px solid transparent;border-radius:11px;
  padding:9px 2px;cursor:pointer;font-family:inherit;display:flex;
  flex-direction:column;align-items:center;gap:3px;}
.gun-cip.bugun{border-color:var(--tur-p);}
.gun-cip.etkin{background:var(--tur);border-color:var(--tur);}
.gun-k{font-size:9.5px;font-weight:800;letter-spacing:.2px;color:var(--sol);}
.gun-cip.etkin .gun-k{color:#fff;}
.gun-s{font-size:10px;font-weight:800;color:var(--met);opacity:.5;}
.gun-s.tam{color:var(--yes);opacity:1;}
.gun-cip.etkin .gun-s{color:#fff;opacity:.85;}

.gorev{display:flex;align-items:center;gap:12px;padding:11px 0;
  border-top:1px solid var(--cizgi);}
.gorev-kutu{width:32px;height:32px;flex-shrink:0;border-radius:10px;
  background:var(--yzy2);border:1.5px solid transparent;color:var(--sol);
  font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;}
.gorev-kutu.dolu{background:var(--yes);color:#fff;}
.gorev-kutu:hover{border-color:var(--tur);}
.gorev-ders{font-size:9.5px;font-weight:800;letter-spacing:.7px;color:var(--tur);}
.gorev-konu{font-size:13.5px;font-weight:700;margin-top:2px;line-height:1.3;}
.gorev.bitti .gorev-konu{text-decoration:line-through;color:var(--sol);}
.gorev.bitti .gorev-ders{opacity:.5;}

.sec-panel{margin-top:16px;padding:14px;background:var(--yzy2);
  border-radius:14px;}
.konu-sec{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;
  max-height:340px;overflow-y:auto;}
.konu-sec-b{text-align:left;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:10px;padding:11px 13px;color:var(--met);font-family:inherit;
  font-weight:700;font-size:13px;cursor:pointer;}
.konu-sec-b:hover{border-color:var(--tur);color:var(--tur);}

/* deneme */
.dn-basl{display:grid;grid-template-columns:1fr 66px 66px 54px;gap:8px;
  margin-top:16px;padding-bottom:8px;}
.dn-basl span{font-size:9px;font-weight:800;color:var(--sol);
  letter-spacing:.7px;text-align:center;}
.dn-basl span:first-child{text-align:left;}
.dn-satir{display:grid;grid-template-columns:1fr 66px 66px 54px;gap:8px;
  align-items:center;padding:5px 0;}
.dn-ad{font-size:13px;font-weight:800;}
.dn-ad i{font-style:normal;font-weight:600;color:var(--sol);font-size:10px;}
.dn-satir input{padding:9px;text-align:center;font-size:14px;}
.dn-net{font-size:13px;font-weight:900;text-align:center;color:var(--tur);
  font-variant-numeric:tabular-nums;}

.grafik{width:100%;height:120px;display:block;}
.grafik-alt{display:flex;justify-content:space-between;font-size:10px;
  font-weight:600;color:var(--sol);margin-top:6px;}
.trend{font-size:13px;font-weight:800;margin-bottom:16px;}
.trend.artis{color:var(--yes);} .trend.dusus{color:var(--kir);}
.cubuklar{display:flex;flex-direction:column;gap:9px;}
.cubuk-satir{display:grid;grid-template-columns:44px 1fr 46px;gap:10px;align-items:center;}
.cubuk-ad{font-size:11px;font-weight:800;color:var(--sol);}
.cubuk-yol{height:8px;background:#E5EFF1;border-radius:99px;overflow:hidden;}
.cubuk-dolu{height:100%;background:linear-gradient(90deg,var(--tur),var(--tur-p));
  border-radius:99px;transition:width .5s;}
.cubuk-net{font-size:12px;font-weight:900;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--met);}
.oneri{margin-top:16px;padding:12px 14px;background:var(--tur-a);border-radius:12px;
  font-size:12.5px;font-weight:600;line-height:1.5;color:#3A6570;}
.oneri b{color:var(--tur);font-weight:800;}
.dnm{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
  border-top:1px solid var(--cizgi);}
.dnm-ad{font-size:14px;font-weight:800;}
.dnm-t{font-size:11px;font-weight:600;color:var(--sol);margin-top:2px;}
.dnm-sag{text-align:right;}
.dnm-net{font-size:19px;font-weight:900;color:var(--tur);font-variant-numeric:tabular-nums;}
.dnm-dilim{font-size:11px;font-weight:600;color:var(--sol);}

/* kitap */
.kitap-ad{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.kitap-bilgi{font-size:12px;font-weight:600;color:var(--sol);margin-top:5px;line-height:1.5;}
.ktp{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 0;border-top:1px solid var(--cizgi);}
.ktp-ad{font-size:14px;font-weight:800;}
.ktp-alt{font-size:11px;font-weight:600;color:var(--sol);margin-top:3px;}
.ktp-t{font-size:11px;font-weight:700;color:var(--tur);margin-top:4px;}

/* boş durum */
.bos{padding:26px 18px;text-align:center;}
.bos-b{font-size:14px;font-weight:800;margin-bottom:6px;}
.bos-m{font-size:12px;font-weight:600;color:var(--sol);line-height:1.5;}

/* logo & imza */
.logo{flex-shrink:0;display:block;border-radius:50%;object-fit:contain;}
.imza{display:flex;flex-direction:column;align-items:center;
  padding:28px 0 10px;text-align:center;}
.imza .logo{margin-bottom:15px;}
.imza-ad{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.45;
  color:var(--met);}
.imza-alt{font-size:12px;font-weight:500;letter-spacing:.2px;
  color:var(--sol);margin-top:12px;padding-top:12px;
  border-top:1px solid var(--cizgi);}

/* konu işaretleme */
.dnm-sag-sar{display:flex;align-items:center;gap:10px;}
.isaret-liste{display:flex;flex-direction:column;gap:5px;margin-top:12px;
  max-height:360px;overflow-y:auto;}
.isaret-satir{display:flex;align-items:center;gap:8px;}
.isaret-ad{flex:1;text-align:left;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:10px;padding:10px 12px;color:var(--met);font-family:inherit;
  font-weight:700;font-size:12.5px;cursor:pointer;}
.isaret-satir.dolu .isaret-ad{background:#FBE3E0;border-color:#EFBDB6;color:#A93A2D;}
.adet{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.adet button{width:28px;height:28px;border-radius:8px;background:var(--yzy2);
  border:none;color:var(--met);font-family:inherit;font-weight:900;
  font-size:15px;cursor:pointer;line-height:1;}
.adet span{min-width:22px;text-align:center;font-size:13px;font-weight:900;
  color:var(--kir);font-variant-numeric:tabular-nums;}

/* analiz */
.eksik{padding:13px 0;border-top:1px solid var(--cizgi);}
.eksik:first-of-type{border-top:none;padding-top:4px;}
.eksik-ust{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.eksik-sol{display:flex;align-items:baseline;gap:7px;min-width:0;}
.eksik-ders{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--tur);
  background:var(--tur-a);padding:3px 7px;border-radius:5px;flex-shrink:0;}
.eksik-ad{font-size:13.5px;font-weight:700;line-height:1.3;}
.eksik-adet{font-size:17px;font-weight:900;color:var(--kir);
  font-variant-numeric:tabular-nums;flex-shrink:0;}
.eksik-yol{height:6px;background:#EEF4F5;border-radius:99px;overflow:hidden;margin-top:8px;}
.eksik-dolu{height:100%;background:linear-gradient(90deg,#E4796C,#D9564A);
  border-radius:99px;transition:width .5s;}
.eksik-alt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;}
.teshis{font-size:9px;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:99px;}
.teshis.kritik{color:#A93A2D;background:#FBE3E0;}
.teshis.orta{color:#8A5C0B;background:#FBEED2;}
.eksik-not{font-size:10.5px;font-weight:600;color:var(--sol);}

.mesaj{margin-top:14px;padding:10px 13px;background:var(--tur-a);
  border-radius:11px;font-size:12px;font-weight:700;color:var(--tur);text-align:center;}

.tavsiye{padding:14px;border-radius:14px;margin-bottom:10px;}
.tavsiye:last-child{margin-bottom:0;}
.tavsiye.kritik{background:#FDEEEC;border:1px solid #F4CFC9;}
.tavsiye.orta{background:#FDF6E7;border:1px solid #F0E0BC;}
.tavsiye-b{font-size:13.5px;font-weight:800;line-height:1.35;color:var(--met);}
.tavsiye-l{font-size:11.5px;font-weight:600;color:var(--sol);
  margin-top:7px;line-height:1.5;}
.tavsiye-o{font-size:12px;font-weight:700;margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(0,0,0,.07);line-height:1.45;}
.tavsiye.kritik .tavsiye-o{color:#A93A2D;}
.tavsiye.orta .tavsiye-o{color:#8A5C0B;}

/* mesajlaşma */
.msj-dugme{position:relative;margin-left:auto;flex-shrink:0;width:36px;height:36px;
  border-radius:11px;background:var(--tur-a);border:none;cursor:pointer;
  display:grid;place-items:center;}
.msj-ikon{font-size:17px;color:var(--tur);line-height:1;}
.msj-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;
  border-radius:99px;background:var(--kir);color:#fff;font-size:10px;
  font-weight:900;display:grid;place-items:center;padding:0 5px;
  border:2px solid #fff;}
.ufak.vurgu{background:#FBE3E0;color:#A93A2D;}

.sohbet-kart{padding-bottom:14px;}
.sohbet{display:flex;flex-direction:column;gap:10px;}
.balon{max-width:82%;padding:10px 13px;border-radius:15px;}
.balon.benim{align-self:flex-end;background:var(--tur);color:#fff;
  border-bottom-right-radius:5px;}
.balon.karsi{align-self:flex-start;background:var(--yzy2);color:var(--met);
  border-bottom-left-radius:5px;}
.balon-kim{font-size:9.5px;font-weight:800;letter-spacing:.5px;
  color:var(--tur);margin-bottom:4px;}
.balon-metin{font-size:13.5px;font-weight:600;line-height:1.45;
  white-space:pre-wrap;word-break:break-word;}
.balon-saat{font-size:9.5px;font-weight:600;margin-top:5px;text-align:right;}
.balon.benim .balon-saat{color:rgba(255,255,255,.65);}
.balon.karsi .balon-saat{color:var(--sol);}

.hazir{display:flex;flex-direction:column;gap:6px;}
.hazir-b{text-align:left;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:11px;padding:10px 13px;color:var(--met);font-family:inherit;
  font-weight:600;font-size:12.5px;line-height:1.4;cursor:pointer;}
.hazir-b:hover{border-color:var(--tur);color:var(--tur);}

.yaz-cubugu{display:flex;gap:8px;align-items:flex-end;
  background:var(--yzy);border:1px solid var(--cizgi);border-radius:18px;
  padding:10px;box-shadow:var(--golge);}
.yaz{flex:1;background:var(--yzy2);border:1.5px solid transparent;border-radius:12px;
  padding:11px 12px;color:var(--met);font-family:inherit;font-weight:600;
  font-size:14px;outline:none;resize:none;line-height:1.4;}
.yaz:focus{border-color:var(--tur);background:#fff;}
.yaz::placeholder{color:#A8BEC3;}
.yaz-b{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--tur);
  border:none;color:#fff;font-size:16px;cursor:pointer;
  box-shadow:0 2px 8px rgba(6,120,140,.22);}
.yaz-b:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}

/* video */
.konu-satir{display:grid;grid-template-columns:1fr repeat(4,31px) 31px;gap:5px;
  align-items:center;padding:7px 0;border-top:1px solid var(--cizgi);}
.konu-basl{display:grid;grid-template-columns:1fr repeat(4,31px) 31px;gap:5px;
  padding-bottom:8px;}
.konu-ad{cursor:pointer;}
.vid-b{height:30px;border-radius:9px;background:var(--yzy2);
  border:1.5px solid transparent;color:#B4C9CE;font-family:inherit;
  font-weight:900;font-size:11px;cursor:pointer;padding:0;}
.vid-b.dolu{background:#B8262A;color:#fff;}
.vid-b.genis{width:34px;height:34px;flex-shrink:0;font-size:12px;}
.vid-b:hover{border-color:var(--tur);}
.ufak.vid-ufak{background:#FBE6E6;color:#9E2226;}

.konu-panel{padding:12px;background:var(--yzy2);border-radius:12px;margin:2px 0 8px;}
.vid-giris{width:100%;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:10px;padding:10px 12px;color:var(--met);font-family:inherit;
  font-weight:600;font-size:12.5px;outline:none;}
.vid-giris:focus{border-color:var(--tur);}
.konu-panel-d{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

.vid-perde{position:fixed;inset:0;z-index:60;background:rgba(10,30,36,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;}
.vid-kutu{width:100%;max-width:520px;background:#FFFFFF;border-radius:18px;
  padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);}
.vid-ust{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.vid-baslik{flex:1;font-size:14px;font-weight:800;line-height:1.3;color:var(--met);}
.vid-kapat{width:32px;height:32px;flex-shrink:0;border-radius:10px;
  background:var(--yzy2);border:none;color:var(--met);font-size:20px;
  line-height:1;cursor:pointer;font-family:inherit;}
.vid-cerceve{position:relative;width:100%;padding-top:56.25%;
  border-radius:12px;overflow:hidden;background:#000;}
.vid-cerceve iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vid-uyari{padding:22px 14px;background:var(--yzy2);border-radius:12px;
  font-size:12.5px;font-weight:600;color:var(--sol);line-height:1.5;text-align:center;}
.vid-dis{display:block;text-align:center;margin-top:11px;font-size:12px;
  font-weight:700;color:var(--tur);text-decoration:none;padding:9px;
  border:1px solid var(--cizgi);border-radius:10px;}

/* seri */
.seri-kart{background:linear-gradient(140deg,#FFFFFF 0%,#FFF4E8 100%);
  border-color:#F2DFC8;}
.seri-ust{display:flex;justify-content:space-between;align-items:flex-end;}
.seri-sayi{font-size:40px;font-weight:900;letter-spacing:-2px;line-height:1;
  color:#C9701B;}
.seri-a{font-size:11px;font-weight:700;color:#A8763C;margin-top:3px;}
.seri-rekor{text-align:right;}
.seri-r-s{font-size:18px;font-weight:900;color:var(--met);}
.seri-r-a{font-size:9.5px;font-weight:700;color:var(--sol);margin-top:2px;}
.seri-noktalar{display:flex;gap:4px;margin-top:14px;}
.nokta{flex:1;height:9px;border-radius:3px;background:#EFE1D0;}
.nokta.dolu{background:linear-gradient(180deg,#F0A03C,#D9781F);}
.seri-yazi{font-size:12px;font-weight:600;color:#8A6845;margin-top:11px;}

/* görüşme notları */
.not-yaz{background:#FFFFFF;border:1.5px solid var(--cizgi);border-radius:11px;
  padding:11px 12px;color:var(--met);font-family:inherit;font-weight:600;
  font-size:13.5px;width:100%;outline:none;resize:vertical;line-height:1.45;}
.not-yaz:focus{border-color:var(--tur);}
.onay{display:flex;align-items:center;gap:9px;width:100%;margin-top:12px;
  background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
  font-size:12.5px;font-weight:700;color:var(--sol);}
.onay-k{width:22px;height:22px;border-radius:7px;background:#FFFFFF;
  border:1.5px solid var(--cizgi);display:grid;place-items:center;
  font-size:13px;font-weight:900;color:#fff;flex-shrink:0;}
.onay.etkin{color:var(--tur);}
.onay.etkin .onay-k{background:var(--tur);border-color:var(--tur);}
.grs{padding:13px 0;border-top:1px solid var(--cizgi);}
.grs:first-of-type{border-top:none;padding-top:2px;}
.grs-ust{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.grs-t{font-size:12px;font-weight:800;color:var(--met);}
.grs-d{display:flex;gap:6px;align-items:center;}
.etiketcik{font-size:9px;font-weight:800;letter-spacing:.4px;padding:5px 9px;
  border-radius:99px;background:var(--yzy2);color:var(--sol);border:none;
  font-family:inherit;cursor:pointer;}
.etiketcik.acik{background:#DFF3EC;color:#0F7355;}
.grs-m{font-size:13px;font-weight:600;line-height:1.5;margin-top:8px;
  white-space:pre-wrap;}
.grs-h{font-size:12.5px;font-weight:700;line-height:1.5;margin-top:10px;
  padding:10px 12px;background:var(--tur-a);border-radius:10px;color:#3A6570;}
.grs-h-a{display:block;font-size:8.5px;font-weight:800;letter-spacing:1.2px;
  color:var(--tur);margin-bottom:4px;}

/* boş bırakma */
.bos-ust{display:flex;gap:14px;align-items:center;}
.bos-halka{flex-shrink:0;width:86px;height:86px;border-radius:50%;
  background:#FBEFEE;display:grid;place-items:center;text-align:center;}
.bos-oran{font-size:22px;font-weight:900;color:#B8493C;letter-spacing:-1px;}
.bos-a{font-size:9px;font-weight:700;color:#A96C63;margin-top:1px;}
.bos-yorum{font-size:12.5px;font-weight:600;line-height:1.5;color:var(--sol);}
.bos-sayi{font-size:11px;font-weight:700;color:var(--sol);margin-top:12px;
  text-align:center;}
.cubuk-dolu.bos-dolu{background:linear-gradient(90deg,#E9A199,#D9564A);}

/* yazdırma */
.baski{display:none;}

}

.konu-vid-sayi{display:inline-block;margin-left:7px;font-size:9.5px;font-weight:800;
  color:var(--tur);background:var(--tur-a);padding:2px 6px;border-radius:5px;
  vertical-align:middle;}
.gorev-vid{font-weight:700;color:var(--sol);letter-spacing:0;}

.bolum:first-of-type{border-top:none;padding-top:2px;}

.bolum-sil{width:28px;height:28px;border-radius:8px;background:#FBE3E0;border:none;
  color:#A93A2D;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;
  font-weight:800;}
.ufakgiris{font-size:11.5px;padding:7px 10px;}

.vid-alt{font-size:10.5px;font-weight:700;color:var(--tur);margin-top:3px;}
.vid-gezinme{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px;}
.vid-gezinme .ikincil{width:100%;}
.vid-gezinme .ikincil:disabled{opacity:.4;cursor:not-allowed;}

/* konu önerileri */
.oneri-liste{display:flex;flex-direction:column;gap:4px;margin-top:-4px;
  padding:8px;background:var(--yzy2);border-radius:12px;

.oneri-b{display:flex;justify-content:space-between;align-items:center;gap:8px;
  text-align:left;background:#FFFFFF;border:1.5px solid var(--cizgi);
  border-radius:10px;padding:10px 12px;color:var(--met);font-family:inherit;
  font-weight:700;font-size:12.5px;cursor:pointer;}
.oneri-b:hover{border-color:var(--tur);color:var(--tur);}
.oneri-ad{min-width:0;line-height:1.3;}
.oneri-asama{flex-shrink:0;font-size:8.5px;font-weight:800;letter-spacing:.4px;

.oneri-not{font-size:10px;font-weight:600;color:var(--sol);text-align:center;
  padding:6px 0 2px;}

.alt{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:repeat(7,1fr);gap:0;padding:9px 4px 14px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--cizgi);z-index:20;}
.alt-b{background:none;border:none;color:var(--sol);font-family:inherit;
  font-weight:800;font-size:8.8px;letter-spacing:0;padding:9px 0;
  border-radius:8px;cursor:pointer;}
.alt-b.etkin{color:#fff;background:var(--tur);}
